<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnóstico Final - Raio X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #111; color: #0f0; font-family: monospace; padding: 20px; }</style>
</head>
<body>
    <h1 class="text-2xl font-bold mb-4">RAIO-X DOS DADOS RECEBIDOS</h1>
    <p class="text-white mb-4">Este script vai mostrar exatamente o que o n8n entregou para o navegador.</p>
    
    <div id="debug-container" class="border border-green-500 p-4 rounded bg-black whitespace-pre-wrap">Carregando dados brutos...</div>

    <div id="interface-preview" class="mt-8 border-t border-gray-700 pt-8">
        <h2 class="text-white text-xl font-sans mb-4">Como o botão seria gerado:</h2>
        <div id="buttons-area" class="flex gap-4 flex-wrap"></div>
    </div>

    <script>
        // --- ⬇️ CONFIRA SE SUAS URLS ESTÃO CERTAS AQUI ⬇️ ---
        const URL_LISTAR = "https://n8n.srv1327557.hstgr.cloud/webhook/d7fa7895-7f17-45bb-95a4-92e18f1c1692"; 
        const ID_CAMPANHA = "1"; // ID fixo para o teste
        // -----------------------------------------------------

        async function runDiagnosis() {
            const container = document.getElementById('debug-container');
            const btnArea = document.getElementById('buttons-area');
            
            try {
                // Adiciona timestamp para impedir cache
                const response = await fetch(`${URL_LISTAR}?id_campanha=${ID_CAMPANHA}&t=${Date.now()}`);
                const data = await response.json();

                // 1. IMPRIME O JSON BRUTO NA TELA
                container.textContent = JSON.stringify(data, null, 4);

                // 2. TENTA GERAR O BOTÃO BASEADO NO DADO
                let lista = Array.isArray(data) ? data : (data.products || []);
                
                if (lista.length === 0) {
                    btnArea.innerHTML = "<span class='text-red-500'>Lista vazia!</span>";
                    return;
                }

                lista.forEach(item => {
                    // Simula a lógica do seu código oficial
                    const prod = item.json ? item.json : item;
                    const idReal = prod.id_grupo;
                    
                    const div = document.createElement('div');
                    div.className = "bg-gray-800 p-4 rounded text-white font-sans max-w-sm";
                    
                    // Verifica se é número 1 ou GRP
                    let statusColor = (idReal == "1" || idReal == 1) ? "text-red-500" : "text-green-400";
                    
                    div.innerHTML = `
                        <p class="font-bold text-sm text-gray-400">Produto: ${prod.nome_produto}</p>
                        <p class="font-mono text-xl ${statusColor} break-all">id_grupo: "${idReal}"</p>
                        <p class="text-xs mt-2 text-gray-500">HTML que seria gerado:</p>
                        <code class="block bg-black p-2 rounded text-xs mt-1 text-blue-300">
                            onclick="saveProduct('${idReal}')"
                        </code>
                    `;
                    btnArea.appendChild(div);
                });

            } catch (error) {
                container.textContent = "ERRO FATAL NA REQUISIÇÃO:\n" + error.message;
            }
        }

        runDiagnosis();
    </script>
</body>
</html>
