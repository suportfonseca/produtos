<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Nickel IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .section-content { display: none; }
        .section-content.active { display: block; }
        .nav-link.active { @apply bg-blue-600 text-white shadow-md; }
    </style>
</head>
<body class="bg-gray-100 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-white flex flex-col shrink-0">
        <div class="p-6 text-2xl font-bold border-b border-slate-800 text-blue-400">🤖 Nickel IA</div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="changeTab('dash')" id="btn-dash" class="nav-link active w-full text-left p-3 rounded-xl flex items-center gap-3 transition">
                <i class="fas fa-th-large w-5"></i> Dashboard
            </button>
            <button onclick="changeTab('logs')" id="btn-logs" class="nav-link w-full text-left p-3 rounded-xl flex items-center gap-3 text-slate-400 hover:text-white transition">
                <i class="fas fa-exchange-alt w-5"></i> Lançamentos
            </button>
            <button onclick="changeTab('fixas')" id="btn-fixas" class="nav-link w-full text-left p-3 rounded-xl flex items-center gap-3 text-slate-400 hover:text-white transition">
                <i class="fas fa-thumbtack w-5"></i> Despesas Fixas
            </button>
            <button onclick="changeTab('charts')" id="btn-charts" class="nav-link w-full text-left p-3 rounded-xl flex items-center gap-3 text-slate-400 hover:text-white transition">
                <i class="fas fa-chart-line w-5"></i> Gráficos
            </button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="handleLogout()" class="w-full text-left p-3 text-slate-400 hover:text-red-400 flex items-center gap-3 transition">
                <i class="fas fa-sign-out-alt w-5"></i> Sair
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-y-auto">
        <header class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-10">
            <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard</h2>
            <div class="flex items-center gap-4">
                <span id="userDisplay" class="text-slate-500 text-sm font-medium italic">Carregando...</span>
            </div>
        </header>

        <div class="p-8">
            <div id="sec-dash" class="section-content active">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border">
                        <p class="text-slate-500 text-xs font-bold uppercase mb-1">Saldo Atual</p>
                        <h3 id="resumo-saldo" class="text-2xl font-black text-slate-900">R$ 0,00</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-green-500">
                        <p class="text-green-600 text-xs font-bold uppercase mb-1">Entradas</p>
                        <h3 id="resumo-entradas" class="text-2xl font-black text-slate-900">R$ 0,00</h3>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-l-red-500">
                        <p class="text-red-600 text-xs font-bold uppercase mb-1">Saídas</p>
                        <h3 id="resumo-saidas" class="text-2xl font-black text-slate-900">R$ 0,00</h3>
                    </div>
                    <div class="bg-blue-600 p-6 rounded-2xl shadow-lg text-white">
                        <p class="text-blue-100 text-xs font-bold uppercase mb-2">Insight da IA 🤖</p>
                        <p id="ia-insight" class="text-sm font-medium italic">Sincronizando...</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="bg-white p-6 rounded-2xl border shadow-sm">
                        <h4 class="font-bold text-slate-800 mb-6 italic text-center underline">Divisão por Categoria</h4>
                        <div class="h-64"><canvas id="chartPie"></canvas></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border shadow-sm">
                        <h4 class="font-bold text-slate-800 mb-6 italic">Análise ABC (Maiores Gastos)</h4>
                        <div id="abc-container" class="space-y-6"></div>
                    </div>
                </div>
            </div>

            <div id="sec-logs" class="section-content">
                <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-slate-400 text-[10px] uppercase font-bold">
                            <tr>
                                <th class="p-4">Data</th>
                                <th class="p-4">Descrição</th>
                                <th class="p-4">Categoria</th>
                                <th class="p-4">Valor</th>
                                <th class="p-4 text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="text-sm divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const S_URL = 'https://eadrnruhmcnzleukmlvj.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhZHJucnVobWNuemxldWttbHZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMzE3NTksImV4cCI6MjA4NzgwNzc1OX0.5YJpeCd8hO_F0yJ4Ry5MVsLkgKSZ4_i6zDkarAX7CLU';
        const supa = window.supabase.createClient(S_URL, S_KEY);

        let pieChart;

        function changeTab(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active', 'bg-blue-600', 'text-white'));
            document.getElementById('sec-' + id).classList.add('active');
            document.getElementById('btn-' + id).classList.add('active', 'bg-blue-600', 'text-white');
        }

        async function fetchData() {
            const { data: { user } } = await supa.auth.getUser();
            if (!user) return window.location.href = "nickel-login.html";
            
            document.getElementById('userDisplay').innerText = user.email;

            // Busca os dados filtrando pelo e-mail em minúsculo
            const { data, error } = await supa
                .from('transactions')
                .select('*')
                .eq('user_email', user.email.toLowerCase());

            if (error) {
                console.error("ERRO NA BUSCA:", error.message);
                document.getElementById('ia-insight').innerText = "Erro ao carregar banco de dados.";
                return;
            }

            renderDashboard(data);
        }

        function renderDashboard(data) {
            let totalIn = 0, totalOut = 0, cats = {};
            const table = document.getElementById('table-body');
            const abc = document.getElementById('abc-container');
            
            table.innerHTML = "";
            abc.innerHTML = "";

            if(!data || data.length === 0) {
                table.innerHTML = "<tr><td colspan='5' class='p-8 text-center text-slate-400'>Nenhum dado encontrado para " + document.getElementById('userDisplay').innerText + "</td></tr>";
                return;
            }

            data.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                const val = parseFloat(item.amount) || 0;
                const isOut = item.type === 'EXPENSE';
                
                if(isOut) { totalOut += val; cats[item.category] = (cats[item.category] || 0) + val; }
                else { totalIn += val; }

                table.innerHTML += `
                    <tr>
                        <td class="p-4">${item.date ? new Date(item.date).toLocaleDateString('pt-BR') : '---'}</td>
                        <td class="p-4 font-bold text-slate-700">${item.description || 'Sem descrição'}</td>
                        <td class="p-4"><span class="bg-slate-100 px-2 py-1 rounded text-[10px] font-black uppercase text-slate-500">${item.category}</span></td>
                        <td class="p-4 font-black ${isOut ? 'text-red-500' : 'text-green-500'}">
                            ${isOut ? '-' : '+'} R$ ${val.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                        </td>
                        <td class="p-4 text-center"><i class="fas fa-trash text-slate-200 hover:text-red-500 cursor-pointer transition"></i></td>
                    </tr>`;
            });

            document.getElementById('resumo-entradas').innerText = `R$ ${totalIn.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('resumo-saidas').innerText = `R$ ${totalOut.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('resumo-saldo').innerText = `R$ ${(totalIn - totalOut).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;

            // Gráfico de Categorias
            if(pieChart) pieChart.destroy();
            pieChart = new Chart(document.getElementById('chartPie'), {
                type: 'doughnut',
                data: { labels: Object.keys(cats), datasets: [{ data: Object.values(cats), backgroundColor: ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6'], borderWidth: 0 }] },
                options: { maintainAspectRatio: false }
            });

            // Curva ABC
            Object.entries(cats).sort((a,b) => b[1] - a[1]).slice(0, 5).forEach(([name, value]) => {
                const perc = totalOut > 0 ? (value / totalOut * 100).toFixed(0) : 0;
                abc.innerHTML += `
                    <div>
                        <div class="flex justify-between font-bold text-slate-700 mb-1 text-xs"><span>${name}</span><span>R$ ${value.toFixed(2)}</span></div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5"><div class="bg-blue-600 h-1.5 rounded-full" style="width: ${perc}%"></div></div>
                    </div>`;
            });

            document.getElementById('ia-insight').innerText = "Tudo certo! Dados sincronizados com o Telegram.";
        }

        async function handleLogout() { await supa.auth.signOut(); window.location.href = "nickel-login.html"; }
        window.onload = fetchData;
    </script>
</body>
</html>
