<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Lojista - Gestão Clips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { 
                        dark: { 950: '#020617', 900: '#0f172a', 800: '#1e293b', 700: '#334155' }, 
                        brand: { 500: '#3b82f6', 600: '#2563eb', glow: 'rgba(59, 130, 246, 0.5)' } 
                    }, 
                    fontFamily: { sans: ['Inter', 'sans-serif'] } 
                } 
            }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #editProductsModal, #newCampaignModal { transition: opacity 0.3s ease, visibility 0.3s; opacity: 0; pointer-events: none; visibility: hidden; }
        #editProductsModal.visible, #newCampaignModal.visible { opacity: 1; pointer-events: auto; visibility: visible; }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .input-error { border-color: #ef4444 !important; animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-dark-950 via-dark-900 to-dark-950">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-dark-950">
        <div class="w-full max-w-sm glass-panel p-10 rounded-[2rem] text-center shadow-2xl relative">
            <div class="w-20 h-20 bg-brand-600 rounded-2xl mx-auto mb-6 flex items-center justify-center text-3xl shadow-lg"><i class="fas fa-store"></i></div>
            <h2 class="text-2xl font-bold mb-2">Painel do Lojista</h2>
            <p class="text-slate-400 text-sm mb-8">Faça login com seu E-mail</p>
            
            <div class="space-y-4">
                <input type="email" id="loginEmail" class="w-full bg-dark-900/50 border border-slate-700 rounded-xl px-5 py-4 text-white outline-none focus:border-brand-500 transition-all text-center placeholder:text-slate-600" placeholder="seu@email.com">
                <input type="password" id="loginPass" class="w-full bg-dark-900/50 border border-slate-700 rounded-xl px-5 py-4 text-white outline-none focus:border-brand-500 transition-all text-center placeholder:text-slate-600" placeholder="Sua Senha">
            </div>
            
            <button onclick="doLogin()" id="btnLogin" class="w-full bg-brand-600 hover:bg-brand-500 py-4 rounded-xl font-bold transition-all shadow-lg shadow-brand-500/20 mt-6 active:scale-95">
                Entrar no Sistema
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden flex-1 flex flex-col max-w-[1400px] mx-auto w-full p-4 md:p-8 fade-in pb-20">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl font-black text-white">Gestão Clips <span class="text-brand-500 text-sm bg-brand-500/10 px-2 py-1 rounded ml-2">PRO</span></h1>
                <p class="text-slate-400 text-xs mt-1 font-bold">Loja: <span id="storeNameDisplay" class="text-white">...</span></p>
            </div>
            <button onclick="logout()" class="glass-panel px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-red-500/20 hover:text-red-400 transition-all border border-white/5 flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
            <div class="glass-panel p-6 rounded-3xl border-l-4 border-brand-500 relative overflow-hidden">
                <div class="absolute right-4 top-4 opacity-10"><i class="fas fa-layer-group text-6xl"></i></div>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Minhas Campanhas</p>
                <p class="text-3xl font-bold text-white mt-1" id="campaignCount">0</p>
            </div>
            <button onclick="openNewCampaignModal()" class="bg-brand-600 hover:bg-brand-500 p-6 rounded-3xl flex items-center justify-center gap-3 shadow-lg transition-transform active:scale-95 group border border-white/10">
                <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-plus"></i></div>
                <div class="text-left">
                    <p class="text-xs font-bold text-blue-100 uppercase opacity-80">Criar Nova</p>
                    <span class="font-bold text-xl">Campanha</span>
                </div>
            </button>
        </div>

        <div class="glass-panel rounded-[2rem] overflow-hidden flex-1 flex flex-col border border-white/5 shadow-2xl">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h3 class="font-bold text-white flex items-center gap-2"><i class="fas fa-history text-slate-500"></i> Histórico</h3>
                <button onclick="fetchDashboard()" class="w-8 h-8 bg-white/10 rounded-lg flex items-center justify-center hover:bg-white/20 transition-all"><i class="fas fa-sync-alt text-xs"></i></button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[600px]">
                    <thead class="bg-dark-900/50 text-slate-500 text-[10px] uppercase font-bold">
                        <tr>
                            <th class="p-5">Status</th>
                            <th class="p-5">Campanha</th>
                            <th class="p-5 text-right">Link / Editar</th>
                        </tr>
                    </thead>
                    <tbody id="campaignList" class="text-sm font-medium text-slate-300 divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="newCampaignModal" class="fixed inset-0 z-[60] flex items-center justify-center bg-dark-950/80 backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-md p-8 rounded-[2rem] shadow-2xl relative bg-dark-900 border border-white/10">
            <button onclick="closeNewCampaignModal()" class="absolute top-6 right-6 text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
            <h3 class="text-xl font-bold text-center mb-1">Nova Campanha</h3>
            <p class="text-center text-slate-400 text-xs mb-6">Dê um nome para identificar esta venda</p>
            
            <input type="text" id="newCampaignName" class="w-full bg-dark-950 border border-slate-700 rounded-xl px-5 py-4 mb-6 text-white outline-none focus:border-brand-500 transition-all font-bold placeholder:font-normal" placeholder="Ex: Queima de Estoque">
            
            <button onclick="createCampaign()" id="btnCreateCamp" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all">
                Criar Agora
            </button>
        </div>
    </div>

    <div id="editProductsModal" class="fixed inset-0 z-[70] flex items-center justify-center bg-dark-950/90 backdrop-blur-xl md:p-6">
        <div class="glass-panel w-full h-full md:rounded-[2.5rem] flex flex-col shadow-2xl relative border border-white/10 md:max-w-6xl bg-dark-900">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-dark-900/50 backdrop-blur-md z-10">
                <div>
                    <h3 class="text-xl font-bold text-white" id="editModalTitle">...</h3>
                    <p class="text-slate-400 text-xs mt-1 flex items-center gap-1"><i class="fas fa-shield-alt text-green-500"></i> Modo de edição segura ativo</p>
                </div>
                <button onclick="closeEditModal()" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 custom-scroll bg-gradient-to-b from-dark-900 to-dark-950" id="productListArea"></div>
            
            <div class="p-6 border-t border-white/5 flex justify-between items-center bg-dark-900/80 backdrop-blur-md z-10">
                <p class="text-xs text-slate-500 hidden md:block">Lembre-se de salvar cada item individualmente.</p>
                <div class="flex gap-3">
                    <button onclick="closeEditModal()" class="px-6 py-3 rounded-xl text-slate-400 hover:text-white font-bold text-sm transition-colors">Voltar</button>
                    <button onclick="activateCampaign()" class="bg-brand-600 hover:bg-brand-500 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg transition-all active:scale-95 flex items-center gap-2">
                        <i class="fas fa-check-circle"></i> Publicar Campanha
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="custom-alert" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-dark-950/80 hidden">
        <div class="bg-white w-full max-w-xs p-6 rounded-2xl text-center shadow-2xl transform transition-all scale-100">
            <div id="alert-icon" class="text-3xl mb-3">⚠️</div>
            <p id="alert-msg" class="text-slate-800 font-bold mb-4">Mensagem</p>
            <button onclick="document.getElementById('custom-alert').classList.add('hidden')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-xl transition-all">Entendido</button>
        </div>
    </div>

    <script>
        // =====================================================================
        // CONFIGURAÇÃO AUTOMÁTICA DE AMBIENTE (TESTE VS PRODUÇÃO)
        // =====================================================================
        const rodandoLocalmente = window.location.hostname === 'localhost' || 
                                  window.location.hostname === '127.0.0.1' || 
                                  window.location.protocol === 'file:';

        const forcarTeste = new URLSearchParams(window.location.search).get('teste') === 'true';
        const MODO_TESTE = rodandoLocalmente || forcarTeste; 

        const BASE_URL = "https://n8n.srv1327557.hstgr.cloud";
        const WEBHOOK_PATH = MODO_TESTE ? "/webhook-test" : "/webhook";

        const ENDPOINTS = {
            MAIN: `${BASE_URL}${WEBHOOK_PATH}/start-campaign`,
            PRODUCTS: `${BASE_URL}${WEBHOOK_PATH}/d7fa7895-7f17-45bb-95a4-92e18f1c1692`,
            UPDATE: `${BASE_URL}${WEBHOOK_PATH}/update-data`
        };

        console.log("Modo N8N ativo:", MODO_TESTE ? "TESTE (webhook-test)" : "PRODUÇÃO (webhook)");
        // =====================================================================

        let currentUser = null;
        let currentCampaignId = null;
        let unsavedChanges = false;

        window.onbeforeunload = function() {
            if (unsavedChanges) return "Você tem alterações não salvas. Deseja sair?";
        };

        // --- SISTEMA DE IDENTIFICAÇÃO DE VÍDEO ---
        function isVideo(url) {
            if (!url) return false;
            const cleanUrl = url.split('?')[0].toLowerCase();
            return cleanUrl.endsWith('.mp4') || cleanUrl.endsWith('.mov') || 
                   cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.ogg') || cleanUrl.endsWith('.m4v');
        }

        function buildMediaTag(url, classes) {
            if (isVideo(url)) {
                return `<video src="${url}" class="${classes}" autoplay loop muted playsinline></video>`;
            }
            return `<img src="${url}" class="${classes}">`;
        }

        window.changeMainMedia = function(pid, url) {
            const container = document.getElementById(`main-media-container-${pid}`);
            if(container) {
                container.innerHTML = buildMediaTag(url, "w-full h-full object-cover transition-opacity duration-300");
            }
        }

        // --- NOVO: SISTEMA DE ORDENAÇÃO DE MINIATURAS ---
        window.moveThumb = function(btn, direction, event) {
            event.stopPropagation(); // Evita que clique na miniatura para abrir a foto
            const thumbDiv = btn.closest('.thumbnail-item');
            const container = thumbDiv.parentElement;
            
            if (direction === 'left' && thumbDiv.previousElementSibling) {
                container.insertBefore(thumbDiv, thumbDiv.previousElementSibling);
                markUnsaved();
            } else if (direction === 'right' && thumbDiv.nextElementSibling) {
                container.insertBefore(thumbDiv.nextElementSibling, thumbDiv);
                markUnsaved();
            }
        };

        // --- LOGIN E DASHBOARD ---
        async function doLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');

            if (!email || !pass) return showAlert("Por favor, preencha E-mail e Senha.");
            if (!email.includes('@')) return showAlert("Digite um E-mail válido.");

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Verificando...'; 
            btn.disabled = true;

            try {
                const res = await fetch(ENDPOINTS.MAIN, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tipo_requisicao: "login", email: email, senha: pass })
                });
                const data = await res.json();

                if (data.success || data.found || data.id_usuario) { 
                    currentUser = { id: data.id_usuario, nome: data.nome_loja || "Minha Loja", email: email };
                    localStorage.setItem('user_session', JSON.stringify(currentUser));
                    initDashboard();
                } else {
                    showAlert("E-mail ou Senha incorretos.");
                }
            } catch (e) {
                showAlert("Erro de conexão. Verifique se o n8n está rodando.");
            } finally {
                btn.innerHTML = 'Entrar no Sistema'; btn.disabled = false;
            }
        }

        function initDashboard() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            if(!currentUser) currentUser = JSON.parse(localStorage.getItem('user_session'));
            document.getElementById('storeNameDisplay').innerText = currentUser.nome;
            fetchDashboard();
        }

        if(localStorage.getItem('user_session')) initDashboard();

        function logout() {
            localStorage.removeItem('user_session');
            location.reload();
        }

        async function fetchDashboard() {
            const tbody = document.getElementById('campaignList');
            tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-500"><i class="fas fa-circle-notch fa-spin"></i> Carregando...</td></tr>';

            try {
                const res = await fetch(ENDPOINTS.MAIN, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tipo_requisicao: "dashboard", id_usuario: currentUser.id })
                });
                const data = await res.json();

                if (data.campanhas && data.campanhas.length > 0) {
                    document.getElementById('campaignCount').innerText = data.campanhas.length;
                    renderTable(data.campanhas);
                } else {
                    document.getElementById('campaignCount').innerText = "0";
                    tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-slate-500">Nenhuma campanha encontrada. Crie a primeira!</td></tr>';
                }
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-red-400">Erro ao carregar dados do n8n.</td></tr>';
            }
        }

        function renderTable(list) {
            const tbody = document.getElementById('campaignList'); tbody.innerHTML = '';
            const baseUrl = window.location.href.replace('admin.html', 'catalogo.html');

            list.forEach(c => {
                const isActive = c.status && c.status.toLowerCase() === 'ativa';
                const statusBadge = isActive 
                    ? '<span class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wide">● Ativa</span>' 
                    : '<span class="text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wide">● Rascunho</span>';

                tbody.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors border-b border-white/5 group">
                        <td class="p-5">${statusBadge}</td>
                        <td class="p-5">
                            <p class="font-bold text-white text-base">${c.nome_campanha}</p>
                            <p class="text-xs text-slate-500 font-mono mt-0.5 opacity-50 group-hover:opacity-100 transition-opacity">ID: ${c.id_campanha}</p>
                        </td>
                        <td class="p-5 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="copyLink('${baseUrl}?id=${c.id_campanha}')" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-brand-600 text-slate-400 hover:text-white border border-white/5 transition-all shadow-md flex items-center justify-center" title="Copiar Link"><i class="fas fa-link"></i></button>
                                <button onclick="openEditor(${c.id_campanha}, '${c.nome_campanha}')" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-white hover:text-dark-900 text-slate-400 border border-white/5 transition-all shadow-md flex items-center justify-center" title="Editar Produtos"><i class="fas fa-pen text-sm"></i></button>
                            </div>
                        </td>
                    </tr>`;
            });
        }

        function openNewCampaignModal() { document.getElementById('newCampaignModal').classList.add('visible'); document.getElementById('newCampaignName').focus(); }
        function closeNewCampaignModal() { document.getElementById('newCampaignModal').classList.remove('visible'); }

        async function createCampaign() {
            const name = document.getElementById('newCampaignName').value;
            const btn = document.getElementById('btnCreateCamp');
            
            if(!name.trim()) {
                document.getElementById('newCampaignName').classList.add('input-error');
                setTimeout(()=>document.getElementById('newCampaignName').classList.remove('input-error'), 500);
                return;
            }

            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Criando...'; btn.disabled = true;

            try {
                await fetch(ENDPOINTS.MAIN, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        tipo_requisicao: "campanha", 
                        Nome_campanha: name, 
                        id_usuario: currentUser.id, 
                        id_campanha: Math.floor(Math.random() * 900000) + 100000 
                    })
                });
                closeNewCampaignModal();
                fetchDashboard();
                showAlert("Campanha criada com sucesso!", "success");
            } catch (e) {
                showAlert("Erro ao criar campanha.");
            } finally {
                btn.innerHTML = 'Criar Agora'; btn.disabled = false;
                document.getElementById('newCampaignName').value = '';
            }
        }

        async function openEditor(id, name) {
            currentCampaignId = id;
            document.getElementById('editModalTitle').innerText = name;
            document.getElementById('editProductsModal').classList.add('visible');
            const area = document.getElementById('productListArea');
            area.innerHTML = '<div class="h-64 flex flex-col items-center justify-center text-slate-500 gap-3"><i class="fas fa-spinner fa-spin text-3xl text-brand-500"></i><p class="animate-pulse">Sincronizando catálogo...</p></div>';

            try {
                const res = await fetch(`${ENDPOINTS.PRODUCTS}?id_campanha=${id}`);
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data.products || []);
                renderProducts(list);
            } catch (e) {
                area.innerHTML = '<div class="text-center py-20 text-red-400">Falha ao carregar produtos.</div>';
            }
        }

        function renderProducts(list) {
            const area = document.getElementById('productListArea'); area.innerHTML = '';
            
            if(list.length === 0) {
                area.innerHTML = '<div class="flex flex-col items-center justify-center h-64 text-slate-500 border-2 border-dashed border-white/5 rounded-3xl bg-white/5"><i class="fas fa-camera text-4xl mb-4 opacity-50"></i><p class="font-bold">Nenhum produto ainda.</p><p class="text-xs mt-1">Envie fotos no Telegram para começar.</p></div>';
                return;
            }

            list.forEach(p => {
                const pid = p.id_grupo || p.id;
                
                let imgs = [];
                if (p.imagens && Array.isArray(p.imagens)) imgs = p.imagens;
                else if (p.url_publica) imgs = [p.url_publica];
                else if (p.midias && Array.isArray(p.midias)) imgs = p.midias.map(m => m.url_publica || m.url);
                
                if (imgs.length === 0) imgs = ['https://placehold.co/400?text=Sem+Foto'];

                const primeiraImg = imgs[0];
                
                let miniaturasHTML = '';
                if (imgs.length > 0 && imgs[0] !== 'https://placehold.co/400?text=Sem+Foto') {
                    miniaturasHTML = `<div class="flex gap-2 mt-3 overflow-x-auto custom-scroll pb-2">`;
                    imgs.forEach((imgUrl) => {
                        
                        const isVid = isVideo(imgUrl);
                        const overlayIcon = isVid ? `<div class="absolute inset-0 bg-black/30 flex items-center justify-center pointer-events-none"><i class="fas fa-play text-white/80 text-xl shadow-sm"></i></div>` : '';

                        // AQUI ESTÃO OS NOVOS CONTROLES DE CHECKBOX E ORDENAÇÃO NA MINIATURA
                        miniaturasHTML += `
                            <div class="thumbnail-item relative w-20 h-20 shrink-0 rounded-lg overflow-hidden border-2 border-transparent hover:border-brand-500 transition-all cursor-pointer group" onclick="changeMainMedia('${pid}', '${imgUrl}')">
                                ${buildMediaTag(imgUrl, "w-full h-full object-cover")}
                                ${overlayIcon}
                                
                                <div class="absolute top-1 right-1 bg-dark-950/80 rounded flex items-center justify-center p-1 shadow-md z-10" title="Publicar esta mídia" onclick="event.stopPropagation();">
                                    <input type="checkbox" class="img-check-${pid} w-4 h-4 accent-brand-500 cursor-pointer" value="${imgUrl}" checked onchange="markUnsaved();">
                                </div>
                                
                                <div class="absolute bottom-0 left-0 right-0 h-6 bg-black/70 backdrop-blur-sm flex items-center justify-between px-2 opacity-0 group-hover:opacity-100 transition-opacity z-10">
                                    <button onclick="moveThumb(this, 'left', event)" class="text-white hover:text-brand-400 p-1" title="Mover para esquerda"><i class="fas fa-chevron-left text-[10px]"></i></button>
                                    <span class="text-[8px] text-slate-300 font-bold tracking-widest">ORDEM</span>
                                    <button onclick="moveThumb(this, 'right', event)" class="text-white hover:text-brand-400 p-1" title="Mover para direita"><i class="fas fa-chevron-right text-[10px]"></i></button>
                                </div>
                            </div>
                        `;
                    });
                    miniaturasHTML += `</div>`;
                }

                area.innerHTML += `
                    <div class="glass-panel p-0 rounded-2xl mb-6 flex flex-col xl:flex-row overflow-hidden bg-dark-950 border border-white/5 shadow-lg group hover:border-brand-500/30 transition-colors" id="card-${pid}">
                        
                        <div class="w-full xl:w-80 p-4 bg-dark-900 border-r border-white/5 relative shrink-0 flex flex-col justify-center">
                            <div class="w-full aspect-square rounded-xl overflow-hidden bg-dark-950 relative shadow-inner">
                                <div id="main-media-container-${pid}" class="w-full h-full">
                                    ${buildMediaTag(primeiraImg, "w-full h-full object-cover transition-opacity duration-300")}
                                </div>
                                <div class="absolute bottom-2 left-2 bg-black/70 backdrop-blur text-white text-[10px] font-bold px-2 py-1 rounded border border-white/10 z-10">
                                    ${imgs.length > 1 ? imgs.length + ' ARQUIVOS' : '1 ARQUIVO'}
                                </div>
                            </div>
                            ${miniaturasHTML}
                        </div>

                        <div class="flex-1 p-6 grid grid-cols-1 md:grid-cols-2 gap-5 relative">
                            <div class="md:col-span-2">
                                <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Nome do Produto <span class="text-red-500">*</span></label>
                                <input type="text" id="name-${pid}" value="${p.nome_produto || ''}" class="w-full bg-dark-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all placeholder:text-slate-600" placeholder="Ex: Conjunto Moletom" onchange="markUnsaved()">
                            </div>
                            
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Preço Original (R$)</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-3.5 text-slate-500 text-xs">R$</span>
                                    <input type="number" step="0.01" id="priceFrom-${pid}" value="${p.preco_de || ''}" class="w-full bg-dark-950 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-white focus:border-brand-500 outline-none transition-all font-mono" placeholder="0.00" onchange="markUnsaved()">
                                </div>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-emerald-500 uppercase mb-1 block">Preço Promo (R$)</label>
                                <div class="relative">
                                    <span class="absolute left-4 top-3.5 text-emerald-600 text-xs">R$</span>
                                    <input type="number" step="0.01" id="priceTo-${pid}" value="${p.preco_por || ''}" class="w-full bg-dark-950 border border-emerald-900/50 rounded-xl pl-10 pr-4 py-3 text-emerald-400 font-bold focus:border-emerald-500 outline-none transition-all font-mono shadow-[0_0_15px_rgba(16,185,129,0.05)]" placeholder="0.00" onchange="markUnsaved()">
                                </div>
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Cor</label>
                                <input type="text" id="color-${pid}" value="${p.cor || ''}" class="w-full bg-dark-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all placeholder:text-slate-600" placeholder="Ex: Preto, Azul..." onchange="markUnsaved()">
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-slate-500 uppercase mb-1 block">Tamanho(s)</label>
                                <input type="text" id="size-${pid}" value="${p.tamanho || ''}" class="w-full bg-dark-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all placeholder:text-slate-600" placeholder="Ex: P, M, G ou 38 ao 42" onchange="markUnsaved()">
                            </div>

                            <div class="md:col-span-2 border-t border-white/5 pt-5 mt-2 flex items-center justify-between">
                                <label class="flex items-center gap-3 cursor-pointer group/chk" title="Desativar oculta o produto inteiro da loja">
                                    <div class="relative">
                                        <input type="checkbox" id="active-${pid}" ${p.ativo !== false ? 'checked' : ''} class="sr-only peer" onchange="markUnsaved()">
                                        <div class="w-10 h-6 bg-slate-700 rounded-full peer peer-checked:bg-green-500 transition-colors"></div>
                                        <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-4"></div>
                                    </div>
                                    <span class="text-xs font-bold text-slate-400 group-hover/chk:text-white transition-colors">Visível na Loja</span>
                                </label>
                                
                                <button onclick="saveProduct('${pid}')" id="btnSave-${pid}" class="bg-slate-800 hover:bg-brand-600 text-white px-6 py-2.5 rounded-xl font-bold text-xs transition-all shadow-md flex items-center gap-2 border border-white/5">
                                    <span>Salvar Item</span> <i class="fas fa-save opacity-50"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function markUnsaved() { unsavedChanges = true; }

        async function saveProduct(pid) {
            const nameField = document.getElementById(`name-${pid}`);
            const pFromField = document.getElementById(`priceFrom-${pid}`);
            const pToField = document.getElementById(`priceTo-${pid}`);
            const colorField = document.getElementById(`color-${pid}`);
            const sizeField = document.getElementById(`size-${pid}`);
            const btn = document.getElementById(`btnSave-${pid}`);

            const name = nameField.value.trim();
            const pFrom = parseFloat(pFromField.value) || 0;
            const pTo = parseFloat(pToField.value) || 0;
            const color = colorField.value.trim();
            const size = sizeField.value.trim();
            const active = document.getElementById(`active-${pid}`).checked; // Pega o toggle de Visível na Loja

            // IMPORTANTE: Como as setas moveram as divs no HTML, este comando abaixo 
            // pega as fotos exatamente na nova ordem visual que o cliente deixou na tela!
            const checkboxFotos = document.querySelectorAll(`.img-check-${pid}:checked`);
            const fotosSelecionadas = Array.from(checkboxFotos).map(cb => cb.value);

            if (!name) {
                showAlert("Erro: O produto precisa ter um nome.");
                nameField.focus();
                nameField.classList.add('input-error');
                setTimeout(() => nameField.classList.remove('input-error'), 1000);
                return;
            }

            if (pTo > pFrom && pFrom > 0) {
                showAlert("Erro Lógico: O preço promocional não pode ser maior que o original.");
                pToField.classList.add('input-error');
                return;
            }

            if (pTo < 0 || pFrom < 0) {
                showAlert("Erro: Preços não podem ser negativos.");
                return;
            }

            if(fotosSelecionadas.length === 0 && document.querySelectorAll(`.img-check-${pid}`).length > 0) {
                 showAlert("Aviso: Você desmarcou todas as fotos deste produto. Recomenda-se publicar com pelo menos uma foto ou vídeo.");
            }

            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Salvando...'; 
            btn.disabled = true;
            btn.classList.add('bg-brand-600');

            try {
                // Aqui estão todas as informações embaladas para o n8n
                const res = await fetch(ENDPOINTS.UPDATE, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: "update_product",
                        id_campanha: currentCampaignId, // <--- ESTA É A LINHA MÁGICA NOVA QUE FALTAVA
                        id_grupo: pid,
                        nome_produto: name,
                        preco_de: pFrom,
                        preco_por: pTo,
                        cor: color,
                        tamanho: size,
                        ativo: active, // Envia o status do produto inteiro para o n8n
                        imagens_selecionadas: fotosSelecionadas // Envia as imagens selecionadas na ORDEM exata!
                    })
                });
                
                if (res.ok) {
                    unsavedChanges = false;
                    btn.innerHTML = '<i class="fas fa-check"></i> Salvo!';
                    btn.classList.remove('bg-slate-800', 'bg-brand-600');
                    btn.classList.add('bg-green-500');
                    
                    setTimeout(() => {
                        btn.innerHTML = originalHtml;
                        btn.disabled = false;
                        btn.classList.remove('bg-green-500');
                        btn.classList.add('bg-slate-800');
                    }, 2000);
                } else { throw new Error(); }
            } catch (e) {
                btn.innerHTML = 'Erro!';
                btn.classList.add('bg-red-500');
                setTimeout(() => { btn.innerHTML = originalHtml; btn.disabled = false; btn.classList.remove('bg-red-500'); }, 2000);
            }
        }

        async function activateCampaign() {
            if(unsavedChanges) {
                if(!confirm("Existem alterações não salvas nos produtos. Deseja publicar mesmo assim?")) return;
            }
            await fetch(ENDPOINTS.UPDATE, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ action: "update_status", id_campanha: currentCampaignId, status: "ativa" })
            });
            closeEditModal();
            fetchDashboard();
            showAlert("Campanha publicada e ativa!", "success");
        }

        function closeEditModal() { 
            if(unsavedChanges && !confirm("Você tem alterações não salvas. Deseja sair?")) return;
            document.getElementById('editProductsModal').classList.remove('visible'); 
            unsavedChanges = false;
        }
        function closeNewCampaignModal() { document.getElementById('newCampaignModal').classList.remove('visible'); }
        
        function copyLink(url) {
            navigator.clipboard.writeText(url);
            const btn = event.currentTarget;
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check text-green-400"></i>';
            setTimeout(() => btn.innerHTML = original, 1500);
        }

        function showAlert(msg, type='error') {
            const box = document.getElementById('custom-alert');
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-icon').innerHTML = type === 'success' ? '✅' : '⚠️';
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
