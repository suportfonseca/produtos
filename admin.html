<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Clips Papelaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);color:white}#custom-alert{opacity:0;pointer-events:none;transition:0.3s}#custom-alert.visible{opacity:1;pointer-events:auto}.alert-box{transform:scale(0.9);transition:0.3s}#custom-alert.visible .alert-box{transform:scale(1)}</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="custom-alert" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="alert-box bg-white max-w-sm p-6 rounded-3xl text-center text-slate-800">
            <h3 id="alert-title" class="text-xl font-black mb-2">Atenção</h3>
            <p id="alert-message" class="text-sm text-slate-500 mb-6">Msg</p>
            <button onclick="closeAlert()" class="w-full bg-slate-100 hover:bg-slate-200 py-3 rounded-xl font-bold">OK</button>
        </div>
    </div>

    <div id="adminLoginArea" class="w-full max-w-md bg-white/5 border border-white/10 p-8 rounded-3xl text-center backdrop-blur-lg">
        <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-6 flex items-center justify-center"><i class="fas fa-lock text-3xl"></i></div>
        <h2 class="text-2xl font-black mb-6">Painel Admin</h2>
        <input type="tel" id="adminPhone" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-5 py-4 mb-4 text-white font-bold outline-none focus:border-blue-500" placeholder="WhatsApp">
        <button id="btnLogin" onclick="checkAuth()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-bold transition-all mb-4">Entrar</button>
        <a href="index.html" class="text-xs text-slate-500 font-bold hover:text-white">Voltar</a>
    </div>

    <div id="adminDashboard" class="hidden w-full max-w-lg">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-black">Olá, Admin 👋</h1>
            <button onclick="location.reload()" class="bg-slate-800 w-10 h-10 rounded-xl hover:bg-red-500 hover:text-white transition-all"><i class="fas fa-sign-out-alt"></i></button>
        </div>
        <div class="bg-white text-slate-800 p-8 rounded-3xl shadow-2xl">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2"><i class="fas fa-rocket text-orange-500"></i> Nova Campanha</h2>
            <input type="text" id="campaignName" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 mb-6 font-bold outline-none focus:ring-2 focus:ring-orange-500" placeholder="Nome da Campanha">
            <button id="btnTrigger" onclick="startCampaign()" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-orange-500/30 transition-all">Disparar Bot</button>
        </div>
    </div>

    <script>
        // SEUS LINKS DO N8N
        const URL_PROD = "https://n8n.srv1327557.hstgr.cloud/webhook/start-campaign";
        const URL_TEST = "https://n8n.srv1327557.hstgr.cloud/webhook-test/start-campaign";
        let adminUser = "";

        function showPopup(msg, type='error') {
            document.getElementById('alert-message').innerText = msg;
            document.getElementById('alert-title').className = type==='success' ? "text-xl font-black text-green-600 mb-2" : "text-xl font-black text-red-600 mb-2";
            document.getElementById('custom-alert').classList.add('visible');
        }
        function closeAlert(){ document.getElementById('custom-alert').classList.remove('visible'); }

        async function sendN8N(payload) {
            const req = async(url) => {
                const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
                if(!res.ok) throw new Error(); return await res.json();
            };
            try { return await req(URL_PROD); } catch { try { return await req(URL_TEST); } catch { return null; } }
        }

        // 1. LOGIN (Envia "login")
        async function checkAuth() {
            const phone = document.getElementById('adminPhone').value.replace(/\D/g,'');
            if(phone.length<8) return showPopup("Número inválido");
            
            const btn = document.getElementById('btnLogin');
            const txt = btn.innerText; btn.innerText="Verificando..."; btn.disabled=true;

            const res = await sendN8N({ usuario_admin: phone, tipo_requisicao: "login" });

            btn.innerText = txt; btn.disabled=false;

            if(res && res.found){
                adminUser = phone;
                document.getElementById('adminLoginArea').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
            } else {
                showPopup("Admin não encontrado na planilha.");
            }
        }

        // 2. CAMPANHA (Envia "campanha")
        async function startCampaign() {
            const name = document.getElementById('campaignName').value;
            if(!name) return showPopup("Digite o nome da campanha");

            const btn = document.getElementById('btnTrigger');
            const txt = btn.innerText; btn.innerText="Iniciando..."; btn.disabled=true;

            const res = await sendN8N({ usuario_admin: adminUser, Nome_campanha: name, tipo_requisicao: "campanha" });

            btn.innerText = txt; btn.disabled=false;

            if(res && res.found){
                showPopup("🚀 Sucesso! Verifique seu Telegram.", "success");
                document.getElementById('campaignName').value = "";
            } else {
                showPopup("Erro ao iniciar.");
            }
        }
    </script>
</body>
</html>
