<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Clips Papelaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { royal: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); min-height: 100vh; color: white; }
        .alert-box { transform: scale(0.9); transition: transform 0.3s ease; }
        #custom-alert.visible .alert-box { transform: scale(1); }
        #custom-alert { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        #custom-alert.visible { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="custom-alert" class="fixed inset-0 z-[200] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="alert-box bg-white w-full max-w-sm p-6 rounded-[24px] shadow-2xl text-center relative overflow-hidden text-slate-800">
            <div id="alert-icon-bg" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 transition-colors">
                <i id="alert-icon" class="fas text-2xl"></i>
            </div>
            <h3 id="alert-title" class="text-xl font-black mb-2">Atenção</h3>
            <p id="alert-message" class="text-sm text-slate-500 font-medium mb-6 leading-relaxed">Mensagem.</p>
            <button onclick="closeAlert()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl transition-colors">Entendido</button>
        </div>
    </div>

    <div id="adminLoginArea" class="w-full max-w-md bg-white/5 backdrop-blur-lg border border-white/10 p-8 rounded-[32px] shadow-2xl text-center">
        <div class="w-20 h-20 bg-blue-500 rounded-3xl flex items-center justify-center mx-auto mb-6 shadow-lg shadow-blue-500/30">
            <i class="fas fa-lock text-3xl text-white"></i>
        </div>
        <h2 class="text-2xl font-black mb-2">Painel Administrativo</h2>
        <p class="text-slate-400 text-sm mb-6">Área restrita para gestão</p>
        
        <input type="tel" id="adminPhone" class="w-full bg-slate-800/50 border border-slate-700 rounded-2xl px-5 py-4 mb-4 outline-none font-bold text-white placeholder-slate-500 focus:border-blue-500 transition-colors" placeholder="WhatsApp Admin">
        
        <button onclick="checkAdminAuth()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all mb-4">Acessar Painel</button>
        
        <a href="index.html" class="text-slate-500 text-xs font-bold hover:text-white transition-colors">← Voltar para a Loja</a>
    </div>

    <div id="adminDashboard" class="hidden w-full max-w-lg">
        
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-black">Olá, Admin 👋</h1>
                <p class="text-slate-400 text-sm">Gerencie suas campanhas</p>
            </div>
            <button onclick="logout()" class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center hover:bg-red-500 hover:text-white transition-all">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <div class="bg-white text-slate-800 p-8 rounded-[32px] shadow-2xl mb-8">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2">
                <span class="bg-orange-100 text-orange-600 w-8 h-8 rounded-lg flex items-center justify-center text-sm"><i class="fas fa-rocket"></i></span>
                Iniciar Nova Campanha
            </h2>
            
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 ml-1">Nome da Campanha</label>
            <input type="text" id="campaignName" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 mb-6 outline-none font-bold text-slate-800 focus:ring-2 focus:ring-orange-500" placeholder="Ex: Volta às Aulas 2024">
            
            <button onclick="triggerN8N()" id="btnN8N" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-500/30 transition-all flex items-center justify-center gap-2">
                <i class="fab fa-whatsapp"></i> Disparar Bot
            </button>
        </div>

        <div class="border border-dashed border-slate-700 rounded-[32px] p-8 text-center bg-slate-800/30">
            <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-edit text-slate-500 text-xl"></i>
            </div>
            <h3 class="font-bold text-slate-300">Edição de Produtos</h3>
            <p class="text-xs text-slate-500 mt-2">Em breve você poderá editar preços e nomes aqui.</p>
        </div>

    </div>

    <script>
        const URL_PROD = "https://n8n.srv1327557.hstgr.cloud/webhook/start-campaign";
        const URL_TEST = "https://n8n.srv1327557.hstgr.cloud/webhook-test/start-campaign";
        let adminUser = "";

        // ALERTAS
        function showPopup(message, type = 'error') {
            const popup = document.getElementById('custom-alert');
            const titleEl = document.getElementById('alert-title');
            const msgEl = document.getElementById('alert-message');
            const iconEl = document.getElementById('alert-icon');
            const iconBg = document.getElementById('alert-icon-bg');

            msgEl.innerText = message;
            popup.classList.add('visible');

            if (type === 'success') {
                titleEl.innerText = "Sucesso!";
                titleEl.className = "text-xl font-black text-green-600 mb-2";
                iconEl.className = "fas fa-check text-2xl text-green-600";
                iconBg.className = "w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-green-100";
            } else {
                titleEl.innerText = "Atenção";
                titleEl.className = "text-xl font-black text-red-600 mb-2";
                iconEl.className = "fas fa-times text-2xl text-red-600";
                iconBg.className = "w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 bg-red-100";
            }
        }
        function closeAlert() { document.getElementById('custom-alert').classList.remove('visible'); }

        // LOGIN
        function checkAdminAuth() {
            const phone = document.getElementById('adminPhone').value;
            const cleanPhone = phone.replace(/\D/g, ''); 

            if(cleanPhone.length < 8) return showPopup("Digite um número válido.", "error");
            
            adminUser = cleanPhone;
            // Efeito visual de transição
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('animate-fade-in');
        }

        function logout() {
            location.reload();
        }

        // INTEGRACAO N8N
        async function triggerN8N() {
            const campaign = document.getElementById('campaignName').value;
            if(!campaign) return showPopup("Dê um nome para a campanha!", "error");
            
            const btn = document.getElementById('btnN8N');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Conectando...'; 
            btn.disabled = true;

            const payload = { 
                Nome_campanha: campaign, 
                usuario_admin: adminUser 
            };

            const enviarRequisicao = async (url) => {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) throw new Error(`Status: ${response.status}`);
                try { return await response.json(); } catch (e) { return null; }
            };

            try {
                let data = await enviarRequisicao(URL_PROD);

                if (!data || data.found !== true) {
                    throw new Error("UserNotFound"); 
                }

                showPopup("🚀 Campanha iniciada com sucesso!", "success");
                setTimeout(() => {
                    // Limpa campo para nova campanha
                    document.getElementById('campaignName').value = "";
                }, 2000);

            } catch (erroProd) {
                if (erroProd.message === "UserNotFound") {
                    showPopup("Administrador não localizado na planilha! Verifique o número.", "error");
                    // Se não achou usuário, volta pro login? Ou deixa tentar de novo?
                    // Vamos deixar tentar de novo por enquanto.
                    return;
                }
                
                try {
                    let dataTest = await enviarRequisicao(URL_TEST);
                    if (!dataTest || dataTest.found !== true) {
                         showPopup("Administrador não localizado (Teste)!", "error");
                    } else {
                         showPopup("⚠️ Campanha iniciada (Teste)!", "success");
                    }
                } catch (erroTest) {
                    console.error("Erro Final:", erroTest);
                    showPopup("Erro de conexão. Verifique o n8n.", "error");
                }
            } finally {
                btn.innerHTML = originalText; 
                btn.disabled = false; 
            }
        }
    </script>
</body>
</html>
