<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão Clips - Painel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' }, brand: { 500: '#3b82f6', 600: '#2563eb' } }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Poppins', sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .status-badge { padding: 4px 10px; border-radius: 6px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 4px; }
        .status-active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-draft { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Modais */
        #custom-alert, #newCampaignModal, #editProductsModal, #activationModal { transition: opacity 0.3s ease, visibility 0.3s; opacity: 0; pointer-events: none; visibility: hidden; }
        #custom-alert.visible, #newCampaignModal.visible, #editProductsModal.visible, #activationModal.visible { opacity: 1; pointer-events: auto; visibility: visible; }
        
        .modal-content { transform: scale(0.95); transition: transform 0.3s ease; }
        .visible .modal-content { transform: scale(1); }
        
        /* Scrollbar bonita */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-safe">

    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark-900">
        <div class="w-full max-w-md glass-panel p-8 rounded-[32px] text-center shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-500 to-purple-500"></div>
            <div class="w-20 h-20 bg-brand-600 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-500/20 text-white text-3xl"><i class="fas fa-lock"></i></div>
            <h2 class="text-2xl font-black mb-2">Painel Admin</h2>
            <p class="text-slate-400 text-sm mb-8">Acesso Restrito</p>
            <input type="tel" id="adminPhone" class="w-full bg-dark-900/50 border border-slate-700 rounded-2xl px-5 py-4 mb-4 text-white font-bold outline-none focus:border-brand-500 transition-colors text-center text-lg tracking-widest" placeholder="WhatsApp">
            <button id="btnLogin" onclick="checkAuth()" class="w-full bg-brand-600 hover:bg-brand-500 py-4 rounded-2xl font-bold transition-all mb-6 shadow-lg shadow-blue-600/20">Entrar</button>
        </div>
    </div>

    <div id="dashboard" class="hidden flex-1 flex flex-col max-w-7xl mx-auto w-full p-4 lg:p-8 fade-in pb-20 md:pb-8">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div class="text-center md:text-left">
                <h1 class="text-2xl md:text-3xl font-black text-white flex items-center justify-center md:justify-start gap-3">Gestão Clips <i class="fas fa-paperclip text-brand-500 transform rotate-45"></i></h1>
                <p class="text-slate-400 text-xs md:text-sm mt-1">Bem-vindo(a), <span class="text-brand-500 font-bold">Admin</span> <span id="env-status" class="text-[9px] bg-slate-700 px-2 py-1 rounded ml-1 uppercase font-bold">...</span></p>
            </div>
            <button onclick="logout()" class="glass-panel px-4 py-2 rounded-xl text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition-all flex items-center gap-2"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="glass-panel p-5 rounded-3xl border-l-4 border-green-500 flex flex-col justify-center">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total Vendido</p>
                <p class="text-xl md:text-2xl font-black text-white" id="totalSalesDisplay">R$ 0,00</p>
            </div>
            <div class="glass-panel p-5 rounded-3xl border-l-4 border-blue-500 flex flex-col justify-center">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Campanhas</p>
                <p class="text-xl md:text-2xl font-black text-white" id="activeCampaignsDisplay">0 Ativas</p>
            </div>
            <button onclick="openNewCampaignModal()" class="bg-brand-600 hover:bg-brand-500 p-5 rounded-3xl flex items-center justify-between shadow-xl transition-all active:scale-95">
                <div class="flex items-center gap-4 text-white text-left w-full">
                    <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-lg shadow-lg backdrop-blur-sm"><i class="fas fa-plus"></i></div>
                    <div><p class="text-xs font-bold text-blue-100 opacity-90">Criar Nova</p><p class="text-xl font-black">Campanha</p></div>
                </div>
            </button>
        </div>

        <div class="glass-panel rounded-[24px] md:rounded-[32px] overflow-hidden flex-1 flex flex-col">
            <div class="p-5 border-b border-white/10 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Histórico</h3>
                <button onclick="fetchDashboardData()" class="w-9 h-9 rounded-xl bg-slate-700 hover:bg-slate-600 flex items-center justify-center transition-colors text-slate-300 hover:text-white"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="overflow-x-auto flex-1 custom-scroll">
                <table class="w-full text-left border-collapse min-w-[600px] md:min-w-full">
                    <thead class="bg-dark-900/30 text-slate-400 text-[10px] uppercase font-bold sticky top-0 backdrop-blur-sm z-10">
                        <tr>
                            <th class="p-4 md:p-6">Status</th>
                            <th class="p-4 md:p-6">Campanha</th>
                            <th class="p-4 md:p-6">Vendas</th>
                            <th class="p-4 md:p-6 text-center">Itens</th>
                            <th class="p-4 md:p-6 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="campaignList" class="text-sm font-medium text-slate-300 divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="editProductsModal" class="fixed inset-0 z-[70] flex items-center justify-center bg-dark-900/90 backdrop-blur-md md:p-4">
        <div class="modal-content glass-panel w-full h-full md:h-[95vh] md:max-w-6xl flex flex-col md:rounded-[32px] shadow-2xl relative text-white bg-dark-900 md:bg-transparent">
            
            <div class="p-4 md:p-8 border-b border-white/10 flex justify-between items-center shrink-0 bg-dark-900/50 backdrop-blur-md z-30">
                <div>
                    <h3 class="text-lg md:text-2xl font-black leading-tight" id="editModalTitle">Editando</h3>
                    <p class="text-slate-400 text-xs mt-1 hidden md:block">Configure os detalhes e verifique as fotos.</p>
                </div>
                <button onclick="closeEditModal()" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-colors"><i class="fas fa-times"></i></button>
            </div>

            <div class="flex-1 overflow-y-auto p-3 md:p-6 custom-scroll bg-dark-900 md:bg-transparent" id="productListArea">
                </div>

            <div class="p-4 md:p-6 border-t border-white/10 shrink-0 flex justify-end gap-3 bg-dark-900 md:bg-transparent z-30">
                <button onclick="concludeEdition()" class="w-full md:w-auto bg-brand-600 hover:bg-brand-500 text-white font-bold py-3 md:py-3 px-8 rounded-xl transition-all shadow-lg shadow-blue-600/20 active:scale-95">Concluir Edição</button>
            </div>
        </div>
    </div>

    <div id="newCampaignModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-dark-900/80 backdrop-blur-sm">
        <div class="modal-content glass-panel w-full max-w-md p-8 rounded-[32px] shadow-2xl relative">
            <button onclick="closeNewCampaignModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            <h3 class="text-2xl font-black text-center mb-8">Lançar Campanha</h3>
            <input type="text" id="campaignNameInput" class="w-full bg-dark-900 border border-slate-600 rounded-2xl px-5 py-4 mb-6 outline-none font-bold text-white focus:border-orange-500" placeholder="Nome da Campanha">
            <button id="btnStart" onclick="triggerCampaign()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all">Disparar</button>
        </div>
    </div>

    <div id="custom-alert" class="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-dark-900/80 backdrop-blur-sm">
        <div class="modal-content bg-white w-full max-w-sm p-6 rounded-[24px] shadow-2xl text-center text-slate-900">
            <div id="alert-icon" class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"></div>
            <h3 id="alert-title" class="text-xl font-black mb-2 text-red-600">Atenção</h3>
            <p id="alert-message" class="text-sm text-slate-500 font-medium mb-6">Msg</p>
            <button onclick="closeAlert()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-3 rounded-xl transition-all">OK</button>
        </div>
    </div>

    <script>
        const ENDPOINTS = {
            MAIN: { prod: "https://n8n.srv1327557.hstgr.cloud/webhook/start-campaign", test: "https://n8n.srv1327557.hstgr.cloud/webhook-test/start-campaign" },
            PRODUCTS: { prod: "https://n8n.srv1327557.hstgr.cloud/webhook/d7fa7895-7f17-45bb-95a4-92e18f1c1692", test: "https://n8n.srv1327557.hstgr.cloud/webhook-test/d7fa7895-7f17-45bb-95a4-92e18f1c1692" },
            UPDATE: { prod: "https://n8n.srv1327557.hstgr.cloud/webhook/update-data", test: "https://n8n.srv1327557.hstgr.cloud/webhook-test/update-data" }
        };

        let adminUser = "", campaignsData = [], currentEditingId = null, autoPlayIntervals = {};

        function closeAlert(){ document.getElementById('custom-alert').classList.remove('visible'); }
        function closeEditModal() { 
            document.getElementById('editProductsModal').classList.remove('visible'); 
            Object.values(autoPlayIntervals).forEach(clearInterval); autoPlayIntervals = {};
            fetchDashboardData(); 
        }
        function openNewCampaignModal() { document.getElementById('newCampaignModal').classList.add('visible'); }
        function closeNewCampaignModal() { document.getElementById('newCampaignModal').classList.remove('visible'); }

        function showPopup(msg, type='success') {
            const el = document.getElementById('custom-alert'), title = document.getElementById('alert-title'), icon = document.getElementById('alert-icon');
            document.getElementById('alert-message').innerText = msg;
            title.innerText = type === 'success' ? "Sucesso!" : "Atenção";
            title.className = type === 'success' ? "text-xl font-black mb-2 text-green-600" : "text-xl font-black mb-2 text-red-600";
            icon.className = `w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-xl ${type === 'success' ? 'bg-green-100 text-green-600' : 'bg-blue-100 text-blue-600'}`;
            icon.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : 'info'}"></i>`;
            el.classList.add('visible');
        }

        async function smartRequest(key, payload = null, method = 'POST', isGet = false) {
            const urls = ENDPOINTS[key], badge = document.getElementById('env-status');
            const runFetch = async (baseUrl) => {
                const finalUrl = isGet ? `${baseUrl}?id_campanha=${currentEditingId}&_t=${Date.now()}` : baseUrl;
                const options = isGet ? { method: 'GET' } : { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) };
                const response = await fetch(finalUrl, options);
                if (!response.ok) throw new Error(); return await response.json();
            };
            try {
                const data = await runFetch(urls.prod);
                if(badge) { badge.innerText = "PROD"; badge.className = "text-[9px] bg-emerald-600 px-2 py-1 rounded ml-1 uppercase font-bold"; }
                return data;
            } catch (error) {
                try {
                    const data = await runFetch(urls.test);
                    if(badge) { badge.innerText = "TEST"; badge.className = "text-[9px] bg-orange-600 px-2 py-1 rounded ml-1 uppercase font-bold"; }
                    return data;
                } catch (e) { return null; }
            }
        }

        async function checkAuth() {
            const phone = document.getElementById('adminPhone').value.replace(/\D/g,'');
            if(phone.length < 8) return showPopup("WhatsApp inválido");
            const btn = document.getElementById('btnLogin'); btn.innerText="..."; btn.disabled=true;
            const res = await smartRequest('MAIN', { usuario_admin: phone, tipo_requisicao: "login" });
            btn.innerText = "Entrar"; btn.disabled=false;
            if(res && res.found){ adminUser = phone; document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('dashboard').classList.remove('hidden'); fetchDashboardData(); }
            else { showPopup("Admin não cadastrado."); }
        }

        async function fetchDashboardData() {
            const tbody = document.getElementById('campaignList');
            if(tbody.innerHTML.trim() === "") tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-500"><i class="fas fa-spinner fa-spin text-xl mb-2"></i><br>Buscando...</td></tr>';
            const res = await smartRequest('MAIN', { usuario_admin: adminUser, tipo_requisicao: "dashboard" });
            if(res && res.found && res.campanhas) {
                campaignsData = res.campanhas.filter(c => c.nome_campanha).map((row, idx) => {
                    let raw = row.status ? row.status.toString().toLowerCase() : 'rascunho';
                    return { id: row.id_campanha || idx, name: row.nome_campanha, status: raw.includes('ativa') ? 'active' : 'draft', sales: row.total_vendas || 0, products: row.qtd_produtos || 0 };
                });
                renderTable(); updateStats();
            } else { tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-red-400">Falha.</td></tr>'; }
        }

        function renderTable() {
            const tbody = document.getElementById('campaignList'); tbody.innerHTML = '';
            campaignsData.slice().reverse().forEach(c => {
                let badge = c.status === 'active' ? '<span class="status-badge status-active">● Ativa</span>' : '<span class="status-badge status-draft">● Rascunho</span>';
                let currency = parseFloat(c.sales).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
                tbody.innerHTML += `<tr class="hover:bg-white/5 border-b border-white/5 transition-all">
                    <td class="p-4 md:p-6">${badge}</td>
                    <td class="p-4 md:p-6 font-bold text-white">${c.name}<p class="text-[10px] text-slate-500 font-normal">ID: ${c.id}</p></td>
                    <td class="p-4 md:p-6 font-mono text-emerald-400 font-bold hidden md:table-cell">${currency}</td>
                    <td class="p-4 md:p-6 text-center"><span class="bg-slate-700/50 px-3 py-1 rounded-full text-[10px]">${c.products}</span></td>
                    <td class="p-4 md:p-6 text-right"><button onclick="openEditProducts('${c.id}', '${c.name}', '${c.status}')" class="bg-slate-700 hover:bg-white hover:text-dark-900 mx-auto ml-auto flex items-center justify-center w-8 h-8 rounded-lg transition-all"><i class="fas fa-pen text-xs"></i></button></td>
                </tr>`;
            });
        }

        function updateStats() {
            document.getElementById('activeCampaignsDisplay').innerText = `${campaignsData.filter(c => c.status === 'active').length} Ativas`;
            document.getElementById('totalSalesDisplay').innerText = campaignsData.reduce((acc, curr) => acc + parseFloat(curr.sales || 0), 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        }

        async function triggerCampaign() {
            const name = document.getElementById('campaignNameInput').value; if(!name) return;
            const btn = document.getElementById('btnStart'); btn.innerHTML='...'; btn.disabled=true;
            const res = await smartRequest('MAIN', { usuario_admin: adminUser, Nome_campanha: name, id_campanha: Math.floor(Date.now() / 1000), tipo_requisicao: "campanha" });
            btn.innerHTML = "Disparar"; btn.disabled=false;
            if(res && res.found){ showPopup("Disparada!", "success"); closeNewCampaignModal(); setTimeout(fetchDashboardData, 1500); }
        }

        async function openEditProducts(id, name, status) {
            currentEditingId = id;
            document.getElementById('editModalTitle').innerText = name;
            document.getElementById('editProductsModal').classList.add('visible');
            const listArea = document.getElementById('productListArea');
            listArea.innerHTML = '<div class="h-64 flex flex-col items-center justify-center text-slate-500"><i class="fas fa-spinner fa-spin text-3xl mb-4 text-brand-500"></i><p>Carregando...</p></div>';

            const data = await smartRequest('PRODUCTS', null, 'GET', true);
            
            // --- DEBUG: Verifique no Console do navegador (F12) o que chegou ---
            console.log("PRODUTOS RECEBIDOS DO N8N:", data);

            let lista = Array.isArray(data) ? data : (data && data.products ? data.products : []);
            
            if(lista.length > 0) processAndRenderProducts(lista);
            else listArea.innerHTML = '<div class="h-64 flex items-center justify-center text-slate-500">Nenhum produto nesta campanha.</div>';
        }

        function processAndRenderProducts(lista) {
            const listArea = document.getElementById('productListArea'); listArea.innerHTML = '';
            
            lista.forEach(item => {
                const prod = item.json ? item.json : item; 
                const pid = prod.id_grupo;

                let imagens = [];
                if (Array.isArray(prod.imagens) && prod.imagens.length > 0) imagens = prod.imagens.filter(url => url); 
                else if (prod.url_publica) imagens = [prod.url_publica];
                else if (prod.arquivo_url) imagens = [prod.arquivo_url];
                else imagens = ['https://placehold.co/600x600?text=Sem+Foto'];

                let imagesHtml = '';
                imagens.forEach((imgUrl, index) => {
                    let opacityClass = index === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0';
                    imagesHtml += `<img src="${imgUrl}" class="product-img-${pid} absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ease-in-out ${opacityClass}" data-index="${index}">`;
                });

                let navHtml = '';
                if (imagens.length > 1) {
                    navHtml = `
                        <button onclick="changeSlide('${pid}', -1, ${imagens.length})" class="absolute left-2 top-1/2 -translate-y-1/2 bg-black/40 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md z-20"><i class="fas fa-chevron-left text-xs"></i></button>
                        <button onclick="changeSlide('${pid}', 1, ${imagens.length})" class="absolute right-2 top-1/2 -translate-y-1/2 bg-black/40 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md z-20"><i class="fas fa-chevron-right text-xs"></i></button>
                        <div class="absolute bottom-3 right-3 bg-black/60 text-white text-[9px] px-2 py-1 rounded-md font-bold backdrop-blur-md z-20"><span id="counter-${pid}">1</span>/${imagens.length}</div>
                    `;
                    startAutoSlide(pid, imagens.length);
                }

                // LAYOUT RESPONSIVO INTELIGENTE
                listArea.innerHTML += `
                    <div class="glass-panel p-4 md:p-6 rounded-2xl flex flex-col lg:flex-row gap-6 items-start mb-6 bg-dark-800/40 border border-white/5">
                        
                        <div class="w-full lg:w-auto flex flex-col items-center gap-4 shrink-0">
                            <div class="w-full max-w-[280px] aspect-square bg-dark-900 rounded-2xl overflow-hidden border border-slate-700 relative shadow-lg mx-auto" onmouseenter="stopAutoSlide('${pid}')" onmouseleave="startAutoSlide('${pid}', ${imagens.length})">
                                ${imagesHtml}
                                ${navHtml}
                                ${imagens.length === 1 ? `<div class="absolute bottom-3 right-3 bg-black/60 text-white text-[9px] px-2 py-1 rounded-md font-bold backdrop-blur-sm z-20">ÚNICA</div>` : ''}
                            </div>

                            <label class="w-full max-w-[280px] relative inline-flex items-center cursor-pointer group bg-dark-900/50 p-2 rounded-xl border border-white/10 mx-auto">
                                <input type="checkbox" id="status_${pid}" class="sr-only peer" ${prod.ativo !== false ? 'checked' : ''} onchange="toggleLocalStatus('${pid}')">
                                <div class="w-9 h-5 bg-slate-600 rounded-full peer peer-checked:bg-green-500 after:content-[''] after:absolute after:top-[12px] after:left-[12px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-full"></div>
                                <span class="ml-3 text-xs font-bold text-slate-400 peer-checked:text-green-400 status-text-${pid}">${prod.ativo !== false ? 'Visível' : 'Oculto'}</span>
                            </label>
                        </div>

                        <div class="flex-1 w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div class="md:col-span-2 lg:col-span-3">
                                <label class="text-[10px] uppercase font-bold text-slate-500 mb-1 block">Nome do Produto</label>
                                <input type="text" id="nome_${pid}" value="${prod.nome_produto || ''}" class="w-full bg-dark-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all text-sm">
                            </div>
                            
                            <div>
                                <label class="text-[10px] uppercase font-bold text-slate-500 mb-1 block">Preço De (R$)</label>
                                <input type="number" step="0.01" id="de_${pid}" value="${prod.preco_de || ''}" class="w-full bg-dark-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all text-sm">
                            </div>
                            
                            <div>
                                <label class="text-[10px] uppercase font-bold text-green-400 mb-1 block">Preço Por (R$)</label>
                                <input type="number" step="0.01" id="por_${pid}" value="${prod.preco_por || ''}" class="w-full bg-dark-900/80 border border-green-500/30 rounded-xl px-4 py-3 text-green-400 font-bold focus:border-green-500 outline-none transition-all text-sm">
                            </div>
                            
                            <div>
                                <label class="text-[10px] uppercase font-bold text-slate-500 mb-1 block">Cor</label>
                                <input type="text" id="cor_${pid}" value="${prod.cor || ''}" class="w-full bg-dark-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all text-sm">
                            </div>
                            
                            <div class="lg:col-span-2">
                                <label class="text-[10px] uppercase font-bold text-slate-500 mb-1 block">Tamanhos</label>
                                <input type="text" id="tam_${pid}" value="${prod.tamanho || ''}" class="w-full bg-dark-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-brand-500 outline-none transition-all text-sm">
                            </div>
                            
                            <div class="flex items-end justify-end md:col-span-2 lg:col-span-3">
                                <button id="btn_save_${pid}" onclick="saveProduct('${pid}')" class="w-full md:w-auto bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white font-bold py-3 px-6 rounded-xl border border-blue-500/30 transition-all flex items-center justify-center gap-2">
                                    <i class="fas fa-save"></i> <span>Salvar Item</span>
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function changeSlide(pid, direction, total) {
            const images = document.querySelectorAll(`.product-img-${pid}`);
            let currentIndex = 0;
            images.forEach((img, idx) => {
                if (img.classList.contains('opacity-100')) currentIndex = idx;
                img.classList.remove('opacity-100', 'z-10'); img.classList.add('opacity-0', 'z-0');
            });
            let newIndex = currentIndex + direction;
            if (newIndex < 0) newIndex = total - 1; else if (newIndex >= total) newIndex = 0;
            images[newIndex].classList.remove('opacity-0', 'z-0'); images[newIndex].classList.add('opacity-100', 'z-10');
            const counter = document.getElementById(`counter-${pid}`); if(counter) counter.innerText = newIndex + 1;
        }

        function startAutoSlide(pid, total) {
            if (total <= 1) return;
            if (autoPlayIntervals[pid]) clearInterval(autoPlayIntervals[pid]);
            autoPlayIntervals[pid] = setInterval(() => changeSlide(pid, 1, total), 3000);
        }

        function stopAutoSlide(pid) { if (autoPlayIntervals[pid]) clearInterval(autoPlayIntervals[pid]); }

        async function saveProduct(pid) {
            const btn = document.getElementById(`btn_save_${pid}`), icon = btn.innerHTML;
            const nome = document.getElementById(`nome_${pid}`).value || "Produto";
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;
            const payload = { 
                action: "update_product", id_grupo: pid, id_campanha: currentEditingId, 
                nome_produto: nome, preco_de: document.getElementById(`de_${pid}`).value,
                preco_por: document.getElementById(`por_${pid}`).value, 
                cor: document.getElementById(`cor_${pid}`).value, 
                tamanho: document.getElementById(`tam_${pid}`).value,
                ativo: document.getElementById(`status_${pid}`).checked
            };
            const res = await smartRequest('UPDATE', payload);
            btn.innerHTML = icon; btn.disabled = false;
            if(res && res.success) showPopup("Salvo!", "success");
        }

        function toggleLocalStatus(pid) {
            const chk = document.getElementById(`status_${pid}`);
            const txt = document.querySelector(`.status-text-${pid}`);
            if(txt) txt.innerText = chk.checked ? 'Visível' : 'Oculto';
        }

        async function concludeEdition() {
            await smartRequest('UPDATE', { action: "update_status", id_campanha: currentEditingId, status: "ativa" });
            closeEditModal();
            showPopup("Campanha Ativada!", "success");
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
