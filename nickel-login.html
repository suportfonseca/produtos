<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nickel IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans antialiased">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">🤖 Nickel IA</h1>
            <p class="text-gray-500">Acesse seu painel financeiro</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-medium mb-2">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition" placeholder="seu@email.com">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Senha</label>
                <input type="password" id="senha" required class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition" placeholder="••••••••">
            </div>

            <div id="mensagem-erro" class="text-red-500 text-sm hidden font-medium text-center bg-red-50 p-2 rounded border border-red-100"></div>
            <div id="mensagem-sucesso" class="text-green-500 text-sm hidden font-medium text-center bg-green-50 p-2 rounded border border-green-100"></div>

            <div class="flex gap-4 pt-2">
                <button type="button" id="btnEntrar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
                    Entrar
                </button>
                <button type="button" id="btnCriar" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition disabled:opacity-50">
                    Criar Conta
                </button>
            </div>
        </form>
        
        <div class="text-center mt-6">
            <a href="nickel.html" class="text-blue-600 hover:underline text-sm font-medium">← Voltar para a página inicial</a>
        </div>
    </div>

    <script>
        const PROJETO_URL = 'https://eadrnruhmcnzleukmlvj.supabase.co';
        const PROJETO_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhZHJucnVobWNuemxldWttbHZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMzE3NTksImV4cCI6MjA4NzgwNzc1OX0.5YJpeCd8hO_F0yJ4Ry5MVsLkgKSZ4_i6zDkarAX7CLU';
        
        const supabase_final = window.supabase.createClient(PROJETO_URL, PROJETO_KEY);

        const emailIn = document.getElementById('email');
        const senhaIn = document.getElementById('senha');
        const erroBox = document.getElementById('mensagem-erro');
        const sucessoBox = document.getElementById('mensagem-sucesso');
        const btnLogin = document.getElementById('btnEntrar');
        const btnSignUp = document.getElementById('btnCriar');

        function limpar() {
            erroBox.classList.add('hidden');
            sucessoBox.classList.add('hidden');
        }

        // ENTRAR
        btnLogin.addEventListener('click', async () => {
            limpar();
            const email = emailIn.value;
            const password = senhaIn.value;

            if (!email || !password) {
                erroBox.innerText = "Preencha e-mail e senha!";
                erroBox.classList.remove('hidden');
                return;
            }

            btnLogin.disabled = true;
            btnLogin.innerText = "Verificando...";

            const { data, error } = await supabase_final.auth.signInWithPassword({ email, password });

            if (error) {
                // Aqui ele vai te dizer o motivo real do erro de POST
                erroBox.innerText = "Erro: " + error.message;
                erroBox.classList.remove('hidden');
                btnLogin.disabled = false;
                btnLogin.innerText = "Entrar";
            } else {
                sucessoBox.innerText = "Login autorizado! Abrindo Dashboard...";
                sucessoBox.classList.remove('hidden');
                setTimeout(() => { window.location.href = "nickel-dashboard.html"; }, 1500);
            }
        });

        // CRIAR CONTA
        btnSignUp.addEventListener('click', async () => {
            limpar();
            const email = emailIn.value;
            const password = senhaIn.value;

            if (!email || !password) {
                erroBox.innerText = "Preencha e-mail e senha!";
                erroBox.classList.remove('hidden');
                return;
            }

            btnSignUp.disabled = true;
            btnSignUp.innerText = "Cadastrando...";

            const { data, error } = await supabase_final.auth.signUp({ email, password });

            if (error) {
                erroBox.innerText = error.message;
                erroBox.classList.remove('hidden');
                btnSignUp.disabled = false;
                btnSignUp.innerText = "Criar Conta";
            } else {
                sucessoBox.innerText = "Conta criada! Já pode clicar em Entrar.";
                sucessoBox.classList.remove('hidden');
                btnSignUp.disabled = false;
                btnSignUp.innerText = "Criar Conta";
            }
        });
    </script>
</body>
</html>
