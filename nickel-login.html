<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nickel IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans antialiased">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">🤖 Nickel IA</h1>
            <p class="text-gray-500">Acesse seu painel financeiro</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-medium mb-2">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition" placeholder="seu@email.com">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Senha</label>
                <input type="password" id="senha" required class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition" placeholder="••••••••">
            </div>

            <div id="mensagem-erro" class="text-red-500 text-sm hidden font-medium text-center bg-red-50 p-2 rounded"></div>
            <div id="mensagem-sucesso" class="text-green-500 text-sm hidden font-medium text-center bg-green-50 p-2 rounded"></div>

            <div class="flex gap-4 pt-2">
                <button type="button" id="btnEntrar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition disabled:opacity-50">
                    Entrar
                </button>
                <button type="button" id="btnCriar" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition disabled:opacity-50">
                    Criar Conta
                </button>
            </div>
        </form>
        
        <div class="text-center mt-6">
            <a href="nickel.html" class="text-blue-600 hover:underline text-sm font-medium">← Voltar para a página inicial</a>
        </div>
    </div>

    <script>
        // Usei nomes de variáveis bem específicos para não dar conflito com nada
        const PROJETO_URL = 'https://eadrnruhmcnzleukmlvj.supabase.co';
        const PROJETO_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhZHJucnVobWNuemxldWttbHZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMzE3NTksImV4cCI6MjA4NzgwNzc1OX0.5YJpeCd8hO_F0yJ4Ry5MVsLkgKSZ4_i6zDkarAX7CLU';
        
        // Inicialização protegida
        const supabase_client = window.supabase.createClient(PROJETO_URL, PROJETO_KEY);

        const inputEmail = document.getElementById('email');
        const inputSenha = document.getElementById('senha');
        const divErro = document.getElementById('mensagem-erro');
        const divSucesso = document.getElementById('mensagem-sucesso');
        const bEntrar = document.getElementById('btnEntrar');
        const bCriar = document.getElementById('btnCriar');

        function limparAlertas() {
            divErro.classList.add('hidden');
            divSucesso.classList.add('hidden');
        }

        function setLoading(estado) {
            bEntrar.disabled = estado;
            bCriar.disabled = estado;
            bEntrar.innerText = estado ? 'Carregando...' : 'Entrar';
        }

        // Lógica de ENTRAR (Verificação real)
        bEntrar.addEventListener('click', async () => {
            limparAlertas();
            const email = inputEmail.value;
            const password = inputSenha.value;

            if (!email || !password) {
                divErro.innerText = "Preencha e-mail e senha!";
                divErro.classList.remove('hidden');
                return;
            }

            setLoading(true);
            const { data, error } = await supabase_client.auth.signInWithPassword({ email, password });

            if (error) {
                divErro.innerText = "Usuário não encontrado ou senha incorreta.";
                divErro.classList.remove('hidden');
                setLoading(false);
            } else {
                divSucesso.innerText = "Login realizado! Entrando no Dashboard...";
                divSucesso.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = "nickel-dashboard.html";
                }, 1500);
            }
        });

        // Lógica de CRIAR CONTA
        bCriar.addEventListener('click', async () => {
            limparAlertas();
            const email = inputEmail.value;
            const password = inputSenha.value;

            if (!email || !password) {
                divErro.innerText = "Defina um e-mail e senha para o cadastro.";
                divErro.classList.remove('hidden');
                return;
            }

            bCriar.disabled = true;
            bCriar.innerText = 'Cadastrando...';

            const { data, error } = await supabase_client.auth.signUp({ email, password });

            if (error) {
                divErro.innerText = error.message;
                divErro.classList.remove('hidden');
                bCriar.disabled = false;
                bCriar.innerText = 'Criar Conta';
            } else {
                divSucesso.innerText = "Conta criada com sucesso!";
                divSucesso.classList.remove('hidden');
                // Futuramente aqui redirecionaremos para a tela de planos
                setTimeout(() => {
                    alert("Redirecionando para a tela de Assinaturas (Em breve)...");
                    bCriar.disabled = false;
                    bCriar.innerText = 'Criar Conta';
                }, 2000);
            }
        });
    </script>
</body>
</html>
