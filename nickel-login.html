<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nickel IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center h-screen font-sans antialiased">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 mb-2">🤖 Nickel IA</h1>
            <p class="text-gray-500">Acesse seu painel financeiro</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-gray-700 font-medium mb-2">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition" placeholder="seu@email.com">
            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-2">Senha</label>
                <input type="password" id="senha" required class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-blue-500 focus:bg-white focus:outline-none transition" placeholder="••••••••">
            </div>

            <div id="mensagem-erro" class="text-red-500 text-sm hidden font-medium text-center"></div>
            <div id="mensagem-sucesso" class="text-green-500 text-sm hidden font-medium text-center"></div>

            <div class="flex gap-4 pt-2">
                <button type="button" id="btnEntrar" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                    Entrar
                </button>
                <button type="button" id="btnCriar" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition">
                    Criar Conta
                </button>
            </div>
        </form>
        
        <div class="text-center mt-6">
            <a href="nickel.html" class="text-blue-600 hover:underline text-sm font-medium">← Voltar para a página inicial</a>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO ÚNICA - NÃO REPETIR ESTAS LINHAS
        const URL_PROJETO = 'https://eadrnruhmcnzleukmlvj.supabase.co';
        const CHAVE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhZHJucnVobWNuemxldWttbHZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIyMzE3NTksImV4cCI6MjA4NzgwNzc1OX0.5YJpeCd8hO_F0yJ4Ry5MVsLkgKSZ4_i6zDkarAX7CLU';
        
        // Inicialização única do cliente Supabase
        const supabase = window.supabase.createClient(URL_PROJETO, CHAVE_ANON);

        const emailField = document.getElementById('email');
        const senhaField = document.getElementById('senha');
        const erroDiv = document.getElementById('mensagem-erro');
        const sucessoDiv = document.getElementById('mensagem-sucesso');

        function limparAlertas() {
            erroDiv.classList.add('hidden');
            sucessoDiv.classList.add('hidden');
        }

        // AÇÃO: CRIAR CONTA
        document.getElementById('btnCriar').addEventListener('click', async () => {
            limparAlertas();
            const email = emailField.value;
            const password = senhaField.value;

            if (!email || !password) {
                erroDiv.innerText = "Preencha todos os campos!";
                erroDiv.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                erroDiv.innerText = error.message;
                erroDiv.classList.remove('hidden');
            } else {
                sucessoDiv.innerText = "Conta criada! Verifique seu e-mail.";
                sucessoDiv.classList.remove('hidden');
            }
        });

        // AÇÃO: FAZER LOGIN
        document.getElementById('btnEntrar').addEventListener('click', async () => {
            limparAlertas();
            const email = emailField.value;
            const password = senhaField.value;

            if (!email || !password) {
                erroDiv.innerText = "Preencha todos os campos!";
                erroDiv.classList.remove('hidden');
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                erroDiv.innerText = "Dados incorretos ou erro no login.";
                erroDiv.classList.remove('hidden');
            } else {
                sucessoDiv.innerText = "Login realizado! Entrando...";
                sucessoDiv.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = "nickel-dashboard.html";
                }, 1500);
            }
        });
    </script>
</body>
</html>
