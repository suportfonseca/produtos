<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clips Papelaria - Vitrine Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { royal: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #dbeafe 100%); min-height: 100vh; }
        .product-card { background: white; border-radius: 24px; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 1px solid rgba(59, 130, 246, 0.1); }
        .product-card:active { transform: scale(0.95); }
        .product-image { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .add-button { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .filter-tab.active { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .discount-badge { background: #ef4444; color: white; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; position: absolute; top: 8px; left: 8px; z-index: 10; }
        .qty-btn { width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #1e293b; font-weight: 800; }
        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-blue-600">
        <div class="bg-white w-full max-w-sm p-8 rounded-[32px] shadow-2xl text-center">
            <div onclick="openAdmin()" class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center mx-auto mb-6 cursor-pointer hover:bg-blue-200 transition-colors">
                <i class="fas fa-paperclip text-3xl text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Clips Papelaria</h1>
            <p class="text-slate-500 mb-8 text-sm">Entre com seu WhatsApp para ver as ofertas exclusivas</p>
            <input type="tel" id="phoneInput" class="w-full bg-slate-50 border-0 rounded-2xl px-5 py-4 mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="(00) 00000-0000">
            <button id="loginButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all">Começar a Comprar</button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-6 bg-slate-900/90 backdrop-blur-md">
        <div class="bg-white w-full max-w-md p-8 rounded-[32px] shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800">Painel do Lojista</h2>
                <button onclick="closeAdmin()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-4">
                <p class="text-sm text-slate-500 mb-4">Clique no botão abaixo para disparar o robô de cadastro no WhatsApp.</p>
                <button onclick="triggerN8N()" id="btnN8N" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition-all">
                    <i class="fas fa-rocket"></i> Iniciar Nova Campanha
                </button>
                <button onclick="closeAdmin()" class="w-full bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl">Voltar ao Login</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden pb-32">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 p-4 border-b border-blue-50">
            <div class="max-w-7xl mx-auto flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Bem-vindo à</p>
                        <h1 class="font-extrabold text-xl text-slate-800">Clips Papelaria</h1>
                    </div>
                    <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center border border-blue-100"><i class="fas fa-shopping-bag text-blue-600"></i></div>
                </div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button class="filter-tab active px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap" data-category="todos">🔥 Todos</button>
                    <button class="filter-tab bg-white border border-slate-100 px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap" data-category="escolar">🎒 Escolar</button>
                    <button class="filter-tab bg-white border border-slate-100 px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap" data-category="bazar">🎁 Bazar</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4">
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </main>
    </div>

    <div id="productModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] p-8 modal-animate max-h-[95vh] overflow-y-auto shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
            <div id="modalContent" class="max-w-xl mx-auto"></div>
        </div>
    </div>

    <div id="cartBar" class="fixed bottom-6 left-4 right-4 bg-slate-900 rounded-3xl p-4 shadow-2xl hidden z-50 transition-all border border-white/10">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-2">
            <div>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Total do Pedido</p>
                <p id="cartTotal" class="text-xl font-black text-white">R$ 0,00</p>
            </div>
            <button id="checkoutButton" class="bg-blue-500 hover:bg-blue-600 text-white px-8 py-4 rounded-2xl font-bold flex items-center gap-3 transition-all">
                Finalizar <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>

    <script>
        let products = [];
        let cart = {};
        let currentCategory = 'todos';
        let tempQty = 1;

        // --- FUNÇÕES ADMIN ---
        function openAdmin() { document.getElementById('adminPanel').classList.remove('hidden'); }
        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
        
        async function triggerN8N() {
            const btn = document.getElementById('btnN8N');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';
            btn.disabled = true;

            try {
                // SUBSTITUA PELA SUA URL DE WEBHOOK DO N8N (O nó de Gatilho/Webhook)
                const response = await fetch('SUA_URL_WEBHOOK_N8N_AQUI', { method: 'POST' });
                alert("🚀 Campanha iniciada! Verifique seu WhatsApp.");
            } catch (e) {
                alert("Erro ao conectar com n8n");
            } finally {
                btn.innerHTML = '<i class="fas fa-rocket"></i> Iniciar Nova Campanha';
                btn.disabled = false;
            }
        }

        // --- LÓGICA DA VITRINE ---
        async function loadProducts() {
            try {
                const response = await fetch('produtos.json?t=' + Date.now());
                products = await response.json();
                renderProducts();
            } catch (e) { console.error("Erro ao carregar produtos:", e); }
        }

        function calculateDiscount(from, to) {
            const f = parseFloat(from); const t = parseFloat(to);
            if (!f || f <= t) return null;
            return Math.round(((f - t) / f) * 100);
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            const filtered = products.filter(p => currentCategory === 'todos' || p.category === currentCategory);
            
            filtered.forEach(p => {
                const discount = calculateDiscount(p.priceFrom, p.priceTo);
                const div = document.createElement('div');
                div.className = 'product-card p-3 relative shadow-lg shadow-blue-900/5';
                div.onclick = (e) => { if(!e.target.closest('button')) openModal(p); };
                
                div.innerHTML = `
                    ${discount ? `<div class="discount-badge">-${discount}%</div>` : ''}
                    <img src="${p.image}" class="product-image rounded-2xl mb-4">
                    <h3 class="text-[13px] font-bold text-slate-700 line-clamp-2 leading-tight mb-3">${p.name}</h3>
                    <div class="flex justify-between items-end">
                        <div>
                            ${parseFloat(p.priceFrom) > parseFloat(p.priceTo) ? `<p class="text-[10px] text-slate-400 line-through">R$ ${parseFloat(p.priceFrom).toFixed(2)}</p>` : ''}
                            <p class="text-blue-600 font-black text-lg">R$ ${parseFloat(p.priceTo).toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart(${p.id}, 1); event.stopPropagation();" class="add-button"><i class="fas fa-plus"></i></button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function openModal(p) {
            tempQty = 1;
            const modal = document.getElementById('productModal');
            const content = document.getElementById('modalContent');
            const discount = calculateDiscount(p.priceFrom, p.priceTo);

            content.innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <div class="relative w-full md:w-1/2">
                        <img src="${p.image}" class="w-full aspect-square object-cover rounded-[32px] shadow-xl">
                        ${discount ? `<div class="absolute top-4 left-4 bg-red-500 text-white font-black px-4 py-2 rounded-2xl shadow-lg">-${discount}% OFF</div>` : ''}
                    </div>
                    <div class="flex-1">
                        <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 text-[10px] font-black uppercase rounded-lg mb-4 italic tracking-widest">${p.category}</span>
                        <h2 class="text-2xl font-black text-slate-800 leading-tight mb-4">${p.name}</h2>
                        <div class="bg-slate-50 rounded-3xl p-6 mb-6">
                            <div class="flex items-center gap-4 mb-2">
                                <span class="text-3xl font-black text-blue-600 italic">R$ ${parseFloat(p.priceTo).toFixed(2)}</span>
                                ${parseFloat(p.priceFrom) > parseFloat(p.priceTo) ? `<span class="text-slate-400 line-through text-lg font-bold">R$ ${parseFloat(p.priceFrom).toFixed(2)}</span>` : ''}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="border border-slate-100 rounded-2xl p-4"><p class="text-xs text-slate-400 font-bold uppercase">🎨 Cor</p><p class="font-bold text-slate-700 capitalize">${p.cor || 'Única'}</p></div>
                            <div class="border border-slate-100 rounded-2xl p-4"><p class="text-xs text-slate-400 font-bold uppercase">📏 Tamanho</p><p class="font-bold text-slate-700 uppercase">${p.tamanho || 'Padrão'}</p></div>
                        </div>
                        <div class="flex items-center justify-between mb-8 bg-slate-50 p-3 rounded-2xl">
                            <p class="font-bold text-slate-600 ml-2">Quantidade:</p>
                            <div class="flex items-center gap-4">
                                <button onclick="updateTempQty(-1)" class="qty-btn text-blue-600"><i class="fas fa-minus"></i></button>
                                <span id="tempQtyDisplay" class="text-xl font-black text-slate-800 min-w-[30px] text-center">1</span>
                                <button onclick="updateTempQty(1)" class="qty-btn text-blue-600"><i class="fas fa-plus"></i></button>
                            </div>
                        </div>
                        <button onclick="addToCart(${p.id}, tempQty); closeModal();" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl flex items-center justify-center gap-3"><i class="fas fa-shopping-cart"></i> Adicionar</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function updateTempQty(val) { tempQty = Math.max(1, tempQty + val); document.getElementById('tempQtyDisplay').innerText = tempQty; }
        function closeModal() { document.getElementById('productModal').classList.add('hidden'); }
        function addToCart(id, qty) { cart[id] = (cart[id] || 0) + qty; updateCartUI(); }

        function updateCartUI() {
            let total = 0; let count = 0;
            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                if(p) { total += parseFloat(p.priceTo) * qty; count += qty; }
            });
            document.getElementById('cartTotal').innerText = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('cartBar').classList.toggle('hidden', count === 0);
        }

        document.getElementById('loginButton').onclick = () => {
            if(document.getElementById('phoneInput').value.length < 8) return alert("WhatsApp inválido");
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadProducts();
        };

        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.className = 'filter-tab bg-white border border-slate-100 px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap');
                btn.className = 'filter-tab active px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap';
                currentCategory = btn.dataset.category; renderProducts();
            };
        });

        document.getElementById('checkoutButton').onclick = () => {
            let msg = "*🛒 NOVO PEDIDO - CLIPS PAPELARIA*\n\n";
            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                msg += `✅ *${qty}x* ${p.name}\n`;
                if(p.cor) msg += `   └ Cor: ${p.cor}\n`;
                msg += `   └ Subtotal: R$ ${(parseFloat(p.priceTo) * qty).toFixed(2)}\n\n`;
            });
            msg += `💰 *TOTAL: ${document.getElementById('cartTotal').innerText}*`;
            window.open(`https://wa.me/5511999999999?text=${encodeURIComponent(msg)}`);
        };
    </script>
</body>
</html>
