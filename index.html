<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos + Admin</title>
    <style>
        /* --- ESTILOS GERAIS --- */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        
        /* TELA DE LOGIN */
        #login-screen {
            display: flex; justify-content: center; align-items: center; height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-box {
            background: white; padding: 2rem; border-radius: 10px; text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 300px;
        }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .btn-primary { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-primary:hover { background: #218838; }

        /* SISTEMA PRINCIPAL (Escondido inicialmente) */
        #app-screen { display: none; }
        
        header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header-btn { background: #555; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; }

        .container { padding: 20px; display: flex; gap: 20px; flex-wrap: wrap; }
        
        /* ÁREA DE PRODUTOS */
        .products-area { flex: 2; min-width: 300px; }
        .product-card {
            background: white; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px;
            border-radius: 8px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .prod-info h3 { margin: 0 0 5px 0; color: #333; }
        .prod-price { color: #27ae60; font-weight: bold; font-size: 1.1em; }
        
        .btn-add { background: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-add:hover { background: #0056b3; }

        /* ÁREA DO CARRINHO */
        .cart-area {
            flex: 1; background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); height: fit-content; min-width: 250px;
            position: sticky; top: 20px;
        }
        .cart-item { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 0.9em; }
        .cart-total { font-size: 1.2em; font-weight: bold; margin-top: 15px; text-align: right; border-top: 2px solid #333; padding-top: 10px; }
        
        #btn-finalizar {
            width: 100%; background: #28a745; color: white; padding: 15px; border: none;
            border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        /* ÁREA ADMIN */
        #admin-panel {
            background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; margin: 20px;
            border-radius: 5px; display: none; /* Escondido por padrão */
        }
        .admin-form input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; margin-right: 5px; }

        /* --- POPUP DE NOTIFICAÇÃO (Prova Social) --- */
        #notification-popup {
            position: fixed; bottom: 20px; left: 20px; background-color: #fff;
            padding: 15px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: flex; align-items: center; gap: 12px; z-index: 1000;
            opacity: 0; visibility: hidden; transform: translateY(20px); transition: all 0.5s ease-in-out;
            border-left: 5px solid #28a745; max-width: 300px;
        }
        #notification-popup.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        .notif-content p { margin: 0; font-size: 14px; color: #333; }
        .notif-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2>Acesso ao Sistema</h2>
            <input type="text" id="username" placeholder="Usuário (admin)">
            <input type="password" id="password" placeholder="Senha (123)">
            <button class="btn-primary" onclick="fazerLogin()">Entrar</button>
            <p id="error-msg" style="color: red; font-size: 12px; display: none;">Dados incorretos!</p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div><strong>Minha Loja</strong> | Olá, <span id="user-display">Visitante</span></div>
            <div>
                <button class="header-btn" onclick="toggleAdmin()">Admin / Adicionar Produtos</button>
                <button class="header-btn" onclick="logout()">Sair</button>
            </div>
        </header>

        <div id="admin-panel">
            <h3>Painel Administrativo - Cadastrar Novo Produto</h3>
            <div class="admin-form">
                <input type="text" id="novo-nome" placeholder="Nome do Produto">
                <input type="number" id="novo-preco" placeholder="Preço (R$)">
                <button class="btn-primary" style="width: auto;" onclick="cadastrarProduto()">Salvar Produto</button>
            </div>
        </div>

        <div class="container">
            <div class="products-area">
                <h2>Produtos Disponíveis</h2>
                <div id="lista-produtos">
                    </div>
            </div>

            <div class="cart-area">
                <h2>Seu Carrinho</h2>
                <div id="lista-carrinho">
                    <p style="color: #777;">Seu carrinho está vazio.</p>
                </div>
                
                <div class="cart-total">
                    Total: R$ <span id="total-valor">0,00</span>
                </div>

                <button id="btn-finalizar" onclick="gerarOrcamento()">
                    GERAR ORÇAMENTO
                </button>
            </div>
        </div>
    </div>

    <div id="notification-popup">
        <div class="notif-icon">🛒</div>
        <div class="notif-content">
            <p id="notif-text">Carregando...</p>
        </div>
    </div>

    <script>
        // --- DADOS INICIAIS ---
        let produtos = [
            { id: 1, nome: "Camiseta Básica", preco: 29.90 },
            { id: 2, nome: "Calça Jeans", preco: 99.90 },
            { id: 3, nome: "Tênis Esportivo", preco: 149.90 },
            { id: 4, nome: "Boné Preto", preco: 19.90 }
        ];

        let carrinho = [];

        // --- SISTEMA DE LOGIN ---
        function fazerLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === '123') {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'block';
                document.getElementById('user-display').innerText = user;
                renderizarProdutos();
                iniciarPopup(); // Inicia o contador "Fulano comprou"
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function logout() {
            location.reload();
        }

        // --- SISTEMA DE PRODUTOS (VITRINE) ---
        function renderizarProdutos() {
            const container = document.getElementById('lista-produtos');
            container.innerHTML = ''; // Limpa antes de renderizar

            produtos.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-card';
                div.innerHTML = `
                    <div class="prod-info">
                        <h3>${p.nome}</h3>
                        <div class="prod-price">R$ ${p.preco.toFixed(2).replace('.', ',')}</div>
                    </div>
                    <button class="btn-add" onclick="adicionarAoCarrinho(${p.id})">Adicionar +</button>
                `;
                container.appendChild(div);
            });
        }

        // --- SISTEMA DO CARRINHO ---
        function adicionarAoCarrinho(id) {
            const produto = produtos.find(p => p.id === id);
            
            // Verifica se já existe no carrinho para aumentar qtd
            const itemExistente = carrinho.find(item => item.id === id);
            
            if (itemExistente) {
                itemExistente.qtd += 1;
            } else {
                carrinho.push({ ...produto, qtd: 1 });
            }
            
            atualizarCarrinhoVisual();
        }

        function atualizarCarrinhoVisual() {
            const container = document.getElementById('lista-carrinho');
            const totalSpan = document.getElementById('total-valor');
            
            container.innerHTML = '';
            let total = 0;

            if (carrinho.length === 0) {
                container.innerHTML = '<p style="color: #777;">Seu carrinho está vazio.</p>';
            } else {
                carrinho.forEach(item => {
                    const subtotal = item.preco * item.qtd;
                    total += subtotal;
                    
                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <span>${item.qtd}x ${item.nome}</span>
                        <span>R$ ${subtotal.toFixed(2).replace('.', ',')}</span>
                    `;
                    container.appendChild(div);
                });
            }

            totalSpan.innerText = total.toFixed(2).replace('.', ',');
        }

        // --- FUNÇÃO DO BOTÃO FINALIZAR (CORRIGIDA) ---
        function gerarOrcamento() {
            const btn = document.getElementById('btn-finalizar');
            
            if (carrinho.length === 0) {
                alert("O carrinho está vazio! Adicione produtos primeiro.");
                return;
            }

            btn.innerHTML = "Gerando Pedido...";
            btn.style.backgroundColor = "#e67e22"; // Muda cor pra laranja

            setTimeout(() => {
                let mensagem = "Olá! Gostaria de fazer o seguinte pedido:%0A%0A";
                let total = 0;

                carrinho.forEach(item => {
                    const sub = item.preco * item.qtd;
                    total += sub;
                    mensagem += `▪ ${item.qtd}x ${item.nome} - R$ ${sub.toFixed(2)}%0A`;
                });

                mensagem += `%0A*TOTAL: R$ ${total.toFixed(2)}*`;

                // URL do WhatsApp (troque o numero 5500... pelo seu)
                const url = `https://wa.me/5511999999999?text=${mensagem}`;
                
                // Abre em nova aba
                window.open(url, '_blank');

                // Reseta botão
                btn.innerHTML = "GERAR ORÇAMENTO";
                btn.style.backgroundColor = "#28a745";
            }, 1000);
        }

        // --- ADMINISTRAÇÃO (ADICIONAR PRODUTOS) ---
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function cadastrarProduto() {
            const nomeInput = document.getElementById('novo-nome');
            const precoInput = document.getElementById('novo-preco');

            if (nomeInput.value && precoInput.value) {
                const novoId = produtos.length + 1;
                produtos.push({
                    id: novoId,
                    nome: nomeInput.value,
                    preco: parseFloat(precoInput.value)
                });
                
                // Limpa inputs
                nomeInput.value = '';
                precoInput.value = '';
                
                alert("Produto cadastrado com sucesso!");
                renderizarProdutos(); // Atualiza a lista na tela
            } else {
                alert("Preencha nome e preço!");
            }
        }

        // --- NOVO: POPUP DE PROVA SOCIAL ("FULANO COMPROU") ---
        function iniciarPopup() {
            const nomes = [
                "Fulano", "Ciclano", "Beltrano", "Ana", "João", "Carlos", 
                "Beatriz", "Fernanda", "Lucas", "Mariana", "Pedro", "Juliana"
            ];
            
            const popup = document.getElementById('notification-popup');
            const popupText = document.getElementById('notif-text');

            function mostrar() {
                // Se o usuário não estiver logado (tela de app oculta), não mostra popup
                if(document.getElementById('app-screen').style.display === 'none') return;

                const nomeAleatorio = nomes[Math.floor(Math.random() * nomes.length)];
                const qtd = Math.floor(Math.random() * 4) + 1; // 1 a 4 itens
                const textoItens = qtd === 1 ? "item" : "itens";

                popupText.innerHTML = `<strong>${nomeAleatorio}</strong> adicionou <strong>${qtd} ${textoItens}</strong> ao carrinho agora.`;
                popup.classList.add('visible');

                // Esconde após 4 seg
                setTimeout(() => {
                    popup.classList.remove('visible');
                }, 4000);
            }

            // Loop infinito com intervalo aleatório
            function agendarProximo() {
                const tempo = Math.floor(Math.random() * (15000 - 8000 + 1) + 8000); // 8 a 15 seg
                setTimeout(() => {
                    mostrar();
                    agendarProximo();
                }, tempo);
            }
            
            // Começa depois de 3 segudos
            setTimeout(agendarProximo, 3000);
        }
    </script>
</body>
</html>
