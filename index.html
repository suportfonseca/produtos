<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - Oferta Especial</title>
    <style>
        /* --- 1. ESTILOS GERAIS (CSS) --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            color: #333;
        }

        /* Topo da página */
        header {
            background-color: #232f3e;
            color: white;
            padding: 15px 0;
            text-align: center;
            margin-bottom: 30px;
        }

        /* Container Principal */
        .main-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }

        /* Área da Imagem (Simulação) */
        .product-image {
            background-color: #ddd;
            width: 100%;
            max-width: 400px;
            height: 400px; /* Espaço para sua foto */
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #777;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Detalhes do Produto */
        .product-details {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 { font-size: 24px; margin-bottom: 10px; color: #111; }
        .desc { color: #555; line-height: 1.5; margin-bottom: 20px; }
        
        .price-tag {
            font-size: 32px;
            color: #b12704; /* Cor de preço estilo Amazon */
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* BOTÃO FINALIZAR (Importante) */
        .btn-comprar {
            background: linear-gradient(to bottom, #f7dfa5, #f0c14b);
            border: 1px solid #a88734;
            color: #111;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            border-radius: 4px;
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-comprar:hover {
            background: linear-gradient(to bottom, #f5d78e, #eeb933);
        }

        .btn-comprar:active {
            transform: scale(0.98);
        }

        /* --- POPUP DE VENDAS --- */
        #sales-popup {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 9999;
            border-left: 5px solid #2ecc71;
            min-width: 280px;

            /* Animação */
            opacity: 0;
            visibility: hidden;
            transform: translateY(50px);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        #sales-popup.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .popup-text p { margin: 0; font-size: 14px; color: #444; }
        .popup-text strong { color: #000; }
        .popup-time { font-size: 11px; color: #888; margin-top: 3px; display: block; }
        
        /* Ícone de check */
        .check-icon {
            width: 24px;
            height: 24px;
            background: #2ecc71;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2>🔒 Ambiente Seguro de Compra</h2>
    </header>

    <div class="main-wrapper">
        
        <div class="product-image">
            <img src="https://via.placeholder.com/400" alt="Foto do Produto" style="max-width:100%; border-radius:8px;">
        </div>

        <div class="product-details">
            <h1>Kit Premium Completo</h1>
            <p class="desc">Garanta agora o seu kit com desconto exclusivo. Promoção por tempo limitado enquanto durarem os estoques.</p>
            
            <div class="price-tag">R$ 97,90</div>

            <button class="btn-comprar" id="botao-finalizar">
                Finalizar Pedido Agora
            </button>

            <p style="text-align: center; margin-top: 15px; font-size: 12px; color: #888;">
                🔒 Pagamento processado com segurança
            </p>
        </div>
    </div>

    <div id="sales-popup">
        <div class="check-icon">✔</div>
        <div class="popup-text">
            <span id="msg-popup">Carregando...</span>
            <span class="popup-time">Agora mesmo</span>
        </div>
    </div>

    <script>
        // --- PARTE 1: LÓGICA DO BOTÃO FINALIZAR ---
        const btn = document.getElementById('botao-finalizar');

        btn.addEventListener('click', function() {
            // EDITAR AQUI: Coloque seu link de checkout real
            const urlCheckout = "https://google.com"; 

            // Efeito visual de carregamento
            const textoOriginal = btn.innerText;
            btn.innerText = "CARREGANDO...";
            btn.style.opacity = "0.8";

            // Simula um pequeno delay para parecer processamento (opcional)
            setTimeout(() => {
                // Tira o alert abaixo quando for colocar no ar!
                alert("Redirecionando para: " + urlCheckout);
                
                // Redireciona de verdade (remova o // da linha abaixo):
                // window.location.href = urlCheckout;
                
                // Reseta o botão
                btn.innerText = textoOriginal;
                btn.style.opacity = "1";
            }, 800);
        });


        // --- PARTE 2: LÓGICA DO POPUP (Contador + Nomes) ---
        const popup = document.getElementById('sales-popup');
        const msgPopup = document.getElementById('msg-popup');

        // Lista de nomes brasileiros
        const nomes = [
            "Fulano", "Ciclano", "Beltrano", "João", "Maria", "Pedro", 
            "Ana", "Lucas", "Fernanda", "Carlos", "Juliana", "Marcos",
            "Larissa", "Rafael", "Camila", "Gustavo", "Patrícia", "Diego",
            "Bruna", "Thiago", "Beatriz", "Rodrigo", "Amanda", "Felipe"
        ];

        // Função para pegar número aleatório (entre min e max)
        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function mostrarPopup() {
            // 1. Sorteia um nome
            const nome = nomes[randomInt(0, nomes.length - 1)];
            
            // 2. Sorteia quantidade (1 a 4, como você pediu)
            const qtd = randomInt(1, 4);
            const termo = qtd > 1 ? "itens" : "item";

            // 3. Monta a frase
            msgPopup.innerHTML = `<strong>${nome}</strong> adicionou <strong>${qtd} ${termo}</strong> ao carrinho.`;

            // 4. Exibe o popup
            popup.classList.add('active');

            // 5. Esconde depois de 4 segundos
            setTimeout(() => {
                popup.classList.remove('active');
            }, 4000);
        }

        // --- AGENDAMENTO DO POPUP ---
        
        // Primeira aparição rápida (3 segundos após abrir a página)
        setTimeout(mostrarPopup, 3000);

        // Repetições subsequentes (Intervalo aleatório para parecer real)
        function agendarProximo() {
            // Tempo aleatório entre 8 e 15 segundos
            const tempoEspera = randomInt(8000, 15000);
            
            setTimeout(() => {
                mostrarPopup();
                agendarProximo(); // Chama a si mesmo para criar um loop infinito
            }, tempoEspera);
        }

        // Inicia o ciclo
        setTimeout(agendarProximo, 3000);

    </script>

</body>
</html>
