<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clips Papelaria - Vitrine Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #dbeafe 100%); min-height: 100vh; }
        .product-card { background: white; border-radius: 24px; overflow: hidden; transition: 0.3s; cursor: pointer; border: 1px solid rgba(59, 130, 246, 0.1); }
        .product-image { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .add-button { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .filter-tab.active { background: #2563eb; color: white; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-blue-600">
        <div class="bg-white w-full max-w-sm p-8 rounded-[32px] shadow-2xl text-center">
            <div onclick="requestAdminLogin()" class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center mx-auto mb-6 cursor-pointer">
                <i class="fas fa-paperclip text-3xl text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold mb-2">Clips Papelaria</h1>
            <input type="tel" id="phoneInput" class="w-full bg-slate-50 border-0 rounded-2xl px-5 py-4 mb-4 outline-none" placeholder="(00) 00000-0000">
            <button id="loginButton" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg">Entrar na Loja</button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-6 bg-slate-900/90 backdrop-blur-md">
        <div class="bg-white w-full max-w-md p-8 rounded-[32px] shadow-2xl text-center">
            <div id="adminLoginArea">
                <h2 class="text-xl font-black mb-6">Acesso Admin</h2>
                <input type="tel" id="adminPhone" class="w-full bg-slate-50 border rounded-2xl px-5 py-4 mb-4 outline-none" placeholder="WhatsApp Admin">
                <button onclick="checkAdminAuth()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl">Verificar</button>
                <button onclick="closeAdmin()" class="w-full text-slate-400 font-bold mt-2">Sair</button>
            </div>
            <div id="adminCampaignArea" class="hidden">
                <h2 class="text-xl font-black mb-6">Nova Campanha 🚀</h2>
                <input type="text" id="campaignName" class="w-full bg-slate-50 border rounded-2xl px-5 py-4 mb-6 outline-none" placeholder="Nome da Campanha">
                <button onclick="triggerN8N()" id="btnN8N" class="w-full bg-orange-500 text-white font-bold py-5 rounded-2xl shadow-lg">Iniciar no WhatsApp</button>
                <button onclick="closeAdmin()" class="w-full text-slate-400 font-bold mt-4 text-xs underline">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden pb-32">
        <header class="bg-white sticky top-0 z-40 p-4 border-b border-blue-50">
            <div class="max-w-7xl mx-auto flex flex-col gap-4">
                <h1 class="font-extrabold text-xl text-slate-800">Clips Papelaria</h1>
            </div>
        </header>
        <main class="max-w-7xl mx-auto p-4">
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </main>
    </div>

    <script>
        // CONFIGURAÇÃO DO WEBHOOK
        const MODO_TESTE = true; // MUDE PARA false QUANDO CLICAR EM "PUBLISH"
        const URL_PROD = "https://n8n.srv1327557.hstgr.cloud/webhook/start-campaign";
        const URL_TEST = "https://n8n.srv1327557.hstgr.cloud/webhook-test/start-campaign";

        let products = [];
        let adminUser = "";

        function requestAdminLogin() { 
            document.getElementById('adminPanel').classList.remove('hidden'); 
        }
        
        function closeAdmin() { 
            document.getElementById('adminPanel').classList.add('hidden'); 
        }
        
        function checkAdminAuth() {
            const phone = document.getElementById('adminPhone').value;
            if(phone.length < 8) return alert("Número inválido");
            adminUser = phone;
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('adminCampaignArea').classList.remove('hidden');
        }

        async function triggerN8N() {
            const campaign = document.getElementById('campaignName').value;
            if(!campaign) return alert("Dê um nome!");
            const btn = document.getElementById('btnN8N');
            const url = MODO_TESTE ? URL_TEST : URL_PROD;
            
            btn.innerHTML = 'Conectando...';
            btn.disabled = true;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        Nome_campanha: campaign, 
                        usuario_admin: adminUser 
                    })
                });
                if (response.ok) { 
                    alert("🚀 Campanha iniciada!"); 
                    closeAdmin(); 
                } else { 
                    alert("Erro ao conectar. Verifique se o n8n está no modo 'Listen'."); 
                }
            } catch (e) { 
                alert("Erro de conexão."); 
            } finally { 
                btn.innerHTML = 'Iniciar Campanha'; 
                btn.disabled = false; 
            }
        }

        document.getElementById('loginButton').onclick = () => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadProducts();
        };

        async function loadProducts() {
            try {
                const response = await fetch('produtos.json?t=' + Date.now());
                products = await response.json();
                renderProducts();
            } catch (e) { console.error(e); }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            products.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-card p-3 shadow-lg';
                div.innerHTML = `
                    <img src="${p.image}" class="product-image rounded-2xl mb-4">
                    <h3 class="text-[13px] font-bold text-slate-700 mb-2">${p.name}</h3>
                    <div class="flex justify-between items-end">
                        <p class="text-blue-600 font-black text-lg">R$ ${parseFloat(p.priceTo).toFixed(2)}</p>
                    </div>`;
                grid.appendChild(div);
            });
        }
    </script>
</body>
</html>
