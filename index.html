<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clips Papelaria - Vitrine Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { royal: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #dbeafe 100%); min-height: 100vh; }
        .product-card { background: white; border-radius: 24px; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: 1px solid rgba(59, 130, 246, 0.1); }
        .product-card:active { transform: scale(0.95); }
        .product-image { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .add-button { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .filter-tab.active { background: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .discount-badge { background: #ef4444; color: white; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; position: absolute; top: 8px; left: 8px; z-index: 10; }
        .qty-btn { width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; color: #1e293b; font-weight: 800; }
        .modal-animate { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-blue-600">
        <div class="bg-white w-full max-w-sm p-8 rounded-[32px] shadow-2xl text-center">
            <div onclick="requestAdminLogin()" class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center mx-auto mb-6 cursor-pointer hover:bg-blue-200 transition-colors">
                <i class="fas fa-paperclip text-3xl text-blue-600"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 mb-2">Clips Papelaria</h1>
            <p class="text-slate-500 mb-8 text-sm">Entre com seu WhatsApp para ver as ofertas exclusivas</p>
            <input type="tel" id="phoneInput" class="w-full bg-slate-50 border-0 rounded-2xl px-5 py-4 mb-4 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="(00) 00000-0000">
            <button id="loginButton" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all">Começar a Comprar</button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-6 bg-slate-900/90 backdrop-blur-md">
        <div class="bg-white w-full max-w-md p-8 rounded-[32px] shadow-2xl">
            <div id="adminLoginArea">
                <h2 class="text-xl font-black text-slate-800 mb-2 text-center text-blue-600">Acesso Restrito</h2>
                <input type="tel" id="adminPhone" class="w-full bg-slate-50 border rounded-2xl px-5 py-4 mb-4 outline-none focus:ring-2 focus:ring-blue-500" placeholder="Seu WhatsApp Admin">
                <button onclick="checkAdminAuth()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl">Verificar Acesso</button>
                <button onclick="closeAdmin()" class="w-full text-slate-400 font-bold py-4 mt-2">Sair</button>
            </div>

            <div id="adminCampaignArea" class="hidden text-center">
                <h2 class="text-xl font-black text-slate-800 mb-6">Nova Campanha 🚀</h2>
                <input type="text" id="campaignName" class="w-full bg-slate-50 border rounded-2xl px-5 py-4 mb-6 outline-none focus:ring-2 focus:ring-orange-500" placeholder="Nome da Campanha">
                <button onclick="triggerN8N()" id="btnN8N" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-black py-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition-all">
                    <i class="fas fa-rocket"></i> Iniciar no WhatsApp
                </button>
                <button onclick="closeAdmin()" class="w-full text-slate-400 font-bold py-4 mt-4 text-xs underline">Voltar</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden pb-32">
        <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 p-4 border-b border-blue-50">
            <div class="max-w-7xl mx-auto flex flex-col gap-4">
                <div class="flex justify-between items-center px-1">
                    <div>
                        <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest leading-none mb-1">Vitrine Digital</p>
                        <h1 class="font-extrabold text-xl text-slate-800">Clips Papelaria</h1>
                    </div>
                    <div class="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center border border-blue-100"><i class="fas fa-shopping-bag text-blue-600"></i></div>
                </div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                    <button class="filter-tab active px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap" data-category="todos">🔥 Todos</button>
                    <button class="filter-tab bg-white border border-slate-100 px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap" data-category="escolar">🎒 Escolar</button>
                    <button class="filter-tab bg-white border border-slate-100 px-5 py-2 rounded-xl text-xs font-bold transition-all whitespace-nowrap" data-category="bazar">🎁 Bazar</button>
                </div>
            </div>
        </header>
        <main class="max-w-7xl mx-auto p-4">
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </main>
    </div>

    <div id="productModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[40px] p-8 modal-animate max-h-[95vh] overflow-y-auto">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-8"></div>
            <div id="modalContent" class="max-w-xl mx-auto"></div>
        </div>
    </div>

    <script>
        let products = [];
        let cart = {};
        let currentCategory = 'todos';
        let tempQty = 1;
        let adminUser = "";

        function requestAdminLogin() { document.getElementById('adminPanel').classList.remove('hidden'); }
        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
        
        function checkAdminAuth() {
            const phone = document.getElementById('adminPhone').value;
            if(phone.length < 8) return alert("Insira um número válido");
            adminUser = phone;
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('adminCampaignArea').classList.remove('hidden');
        }

        async function triggerN8N() {
            const campaign = document.getElementById('campaignName').value;
            if(!campaign) return alert("Digite o nome da campanha");
            const btn = document.getElementById('btnN8N');
            btn.innerHTML = 'Iniciando...';
            btn.disabled = true;

            try {
                const response = await fetch('https://n8n.srv1327557.hstgr.cloud/webhook-test/start-campaign', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome_campanha: campaign, usuario_admin: adminUser })
                });
                if (response.ok) { alert("🚀 Campanha iniciada!"); closeAdmin(); }
                else { alert("Erro: Verifique se o n8n está ouvindo o teste."); }
            } catch (e) { alert("n8n fora do ar ou URL errada."); }
            finally { btn.innerHTML = 'Iniciar Campanha'; btn.disabled = false; }
        }

        async function loadProducts() {
            try {
                const response = await fetch('produtos.json?t=' + Date.now());
                products = await response.json();
                renderProducts();
            } catch (e) { console.error(e); }
        }

        function calculateDiscount(from, to) {
            const f = parseFloat(from); const t = parseFloat(to);
            if (!f || f <= t) return null;
            return Math.round(((f - t) / f) * 100);
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
            products.filter(p => currentCategory === 'todos' || p.category === currentCategory).forEach(p => {
                const discount = calculateDiscount(p.priceFrom, p.priceTo);
                const div = document.createElement('div');
                div.className = 'product-card p-3 relative shadow-lg';
                div.onclick = (e) => { if(!e.target.closest('button')) openModal(p); };
                div.innerHTML = `
                    ${discount ? `<div class="discount-badge">-${discount}%</div>` : ''}
                    <img src="${p.image}" class="product-image rounded-2xl mb-4">
                    <h3 class="text-[13px] font-bold text-slate-700 line-clamp-2 mb-3">${p.name}</h3>
                    <div class="flex justify-between items-end">
                        <div>
                            ${parseFloat(p.priceFrom) > parseFloat(p.priceTo) ? `<p class="text-[10px] text-slate-400 line-through">R$ ${parseFloat(p.priceFrom).toFixed(2)}</p>` : ''}
                            <p class="text-blue-600 font-black text-lg">R$ ${parseFloat(p.priceTo).toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart(${p.id}, 1); event.stopPropagation();" class="add-button"><i class="fas fa-plus"></i></button>
                    </div>`;
                grid.appendChild(div);
            });
        }

        function openModal(p) {
            tempQty = 1; const modal = document.getElementById('productModal');
            document.getElementById('modalContent').innerHTML = `
                <div class="flex flex-col md:flex-row gap-8">
                    <img src="${p.image}" class="w-full md:w-1/2 aspect-square object-cover rounded-[32px] shadow-xl">
                    <div class="flex-1">
                        <h2 class="text-2xl font-black text-slate-800 mb-4">${p.name}</h2>
                        <div class="bg-slate-50 rounded-3xl p-6 mb-6">
                            <span class="text-3xl font-black text-blue-600 italic">R$ ${parseFloat(p.priceTo).toFixed(2)}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 mb-8">
                            <div class="border rounded-2xl p-4"><p class="text-xs text-slate-400 uppercase">🎨 Cor</p><p class="font-bold">${p.cor || 'Única'}</p></div>
                            <div class="border rounded-2xl p-4"><p class="text-xs text-slate-400 uppercase">📏 Tamanho</p><p class="font-bold uppercase">${p.tamanho || 'GG'}</p></div>
                        </div>
                        <button onclick="addToCart(${p.id}, 1); closeModal();" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl shadow-xl">Adicionar ao Carrinho</button>
                    </div>
                </div>`;
            modal.classList.remove('hidden');
        }

        function closeModal() { document.getElementById('productModal').classList.add('hidden'); }
        function addToCart(id, qty) { cart[id] = (cart[id] || 0) + qty; alert("Adicionado!"); }

        document.getElementById('loginButton').onclick = () => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadProducts();
        };
    </script>
</body>
</html>
