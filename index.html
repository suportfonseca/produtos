<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clips Papelaria - Vitrine Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { royal: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #dbeafe 100%); min-height: 100vh; }
        .product-card { background: white; border-radius: 24px; overflow: hidden; transition: 0.3s; cursor: pointer; border: 1px solid rgba(59, 130, 246, 0.1); }
        .product-image { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .add-button { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .filter-tab.active { background: #2563eb; color: white; }
        .discount-badge { background: #ef4444; color: white; font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 8px; position: absolute; top: 8px; left: 8px; }
        .qty-btn { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #f1f5f9; font-weight: 800; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-slate-900">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-blue-600 font-bold">
        <div class="bg-white w-full max-w-sm p-8 rounded-[32px] shadow-2xl text-center">
            <div onclick="requestAdminLogin()" class="w-20 h-20 bg-blue-100 rounded-3xl flex items-center justify-center mx-auto mb-6 cursor-pointer">
                <i class="fas fa-paperclip text-3xl text-blue-600 font-bold"></i>
            </div>
            <h1 class="text-2xl font-extrabold mb-2 font-bold">Clips Papelaria</h1>
            <input type="tel" id="phoneInput" class="w-full bg-slate-50 border-0 rounded-2xl px-5 py-4 mb-4 outline-none font-bold" placeholder="(00) 00000-0000">
            <button id="loginButton" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg font-bold">Entrar na Loja</button>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-6 bg-slate-900/90 backdrop-blur-md font-bold">
        <div class="bg-white w-full max-w-md p-8 rounded-[32px] shadow-2xl text-center font-bold">
            <div id="adminLoginArea" class="font-bold">
                <h2 class="text-xl font-black mb-6 font-bold">Acesso Admin</h2>
                <input type="tel" id="adminPhone" class="w-full bg-slate-50 border rounded-2xl px-5 py-4 mb-4 outline-none font-bold text-slate-800" placeholder="WhatsApp Admin">
                <button onclick="checkAdminAuth()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-2xl font-bold">Verificar</button>
                <button onclick="closeAdmin()" class="w-full text-slate-400 font-bold mt-2 font-bold">Sair</button>
            </div>
            <div id="adminCampaignArea" class="hidden font-bold">
                <h2 class="text-xl font-black mb-6 text-slate-800 font-bold font-bold">Nova Campanha 🚀</h2>
                <input type="text" id="campaignName" class="w-full bg-slate-50 border rounded-2xl px-5 py-4 mb-6 outline-none font-bold text-slate-800" placeholder="Nome da Campanha">
                <button onclick="triggerN8N()" id="btnN8N" class="w-full bg-orange-500 text-white font-bold py-5 rounded-2xl shadow-lg font-bold">Iniciar no WhatsApp</button>
                <button onclick="closeAdmin()" class="w-full text-slate-400 font-bold mt-4 text-xs font-bold font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden pb-32 font-bold">
        <header class="bg-white sticky top-0 z-40 p-4 border-b border-blue-50 font-bold font-bold">
            <div class="max-w-7xl mx-auto flex flex-col gap-4 font-bold font-bold">
                <h1 class="font-extrabold text-xl text-slate-800 font-bold font-bold">Clips Papelaria</h1>
                <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1 font-bold">
                    <button class="filter-tab active px-5 py-2 rounded-xl text-xs font-bold whitespace-nowrap" data-category="todos">🔥 Todos</button>
                    <button class="filter-tab bg-white border border-slate-100 px-5 py-2 rounded-xl text-xs font-bold whitespace-nowrap" data-category="bazar">🎁 Bazar</button>
                </div>
            </div>
        </header>
        <main class="max-w-7xl mx-auto p-4 font-bold text-slate-800">
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 font-bold"></div>
        </main>
    </div>

    <script>
        let products = []; let cart = {}; let currentCategory = 'todos'; let tempQty = 1; let adminUser = "";

        function requestAdminLogin() { document.getElementById('adminPanel').classList.remove('hidden'); }
        function closeAdmin() { document.getElementById('adminPanel').classList.add('hidden'); }
        function checkAdminAuth() {
            const phone = document.getElementById('adminPhone').value;
            if(phone.length < 8) return alert("Número inválido");
            adminUser = phone;
            document.getElementById('adminLoginArea').classList.add('hidden');
            document.getElementById('adminCampaignArea').classList.remove('hidden');
        }

        async function triggerN8N() {
    const campaign = document.getElementById('campaignName').value;
    if(!campaign) return alert("Dê um nome!");
    const btn = document.getElementById('btnN8N');
    btn.innerHTML = 'Conectando...'; btn.disabled = true;

    try {
        // Use EXATAMENTE a URL de PRODUÇÃO sem o "-test"
        const response = await fetch('https://n8n.srv1327557.hstgr.cloud/webhook/start-campaign', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            mode: 'cors', // Adicionado para evitar bloqueio do navegador
            body: JSON.stringify({ 
                Nome_campanha: campaign, 
                usuario_admin: adminUser 
            })
        });

        if (response.ok) { 
            alert("🚀 Campanha iniciada com sucesso!"); 
            closeAdmin(); 
        } else { 
            alert("Erro no n8n: Verifique se o fluxo está PUBLICADO (botão Publish)."); 
        }
    } catch (e) { 
        alert("Erro de conexão: O n8n recusou a requisição ou o endereço está errado."); 
        console.error("Detalhes do erro:", e);
    } finally { 
        btn.innerHTML = 'Iniciar Campanha'; 
        btn.disabled = false; 
    }
}}

        async function loadProducts() {
            try {
                const response = await fetch('produtos.json?t=' + Date.now());
                products = await response.json(); renderProducts();
            } catch (e) { console.error(e); }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
            products.filter(p => currentCategory === 'todos' || p.category === currentCategory).forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-card p-3 shadow-lg font-bold';
                div.innerHTML = `
                    <img src="${p.image}" class="product-image rounded-2xl mb-4 font-bold">
                    <h3 class="text-[13px] font-bold text-slate-700 font-bold mb-2">${p.name}</h3>
                    <div class="flex justify-between items-end font-bold font-bold">
                        <p class="text-blue-600 font-black text-lg font-bold">R$ ${parseFloat(String(p.priceTo).replace(',','.')).toFixed(2)}</p>
                        <button class="add-button font-bold"><i class="fas fa-plus font-bold"></i></button>
                    </div>`;
                grid.appendChild(div);
            });
        }

        document.getElementById('loginButton').onclick = () => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadProducts();
        };
    </script>
</body>
</html>
