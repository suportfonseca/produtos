<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clips Papelaria - Vitrine Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { royal: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }, fontFamily: { sans: ['Poppins', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #dbeafe 100%); min-height: 100vh; }
        .product-card { background: white; border-radius: 20px; overflow: hidden; transition: all 0.3s ease; }
        .product-image { width: 100%; aspect-ratio: 1; object-fit: cover; }
        .add-button { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .filter-tab.active { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
        .cart-bar { background: white; box-shadow: 0 -5px 30px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <div id="loginScreen" class="fixed inset-0 z-50 flex items-center justify-center p-6 bg-gradient-to-br from-blue-900 to-blue-500">
        <div class="bg-white w-full max-w-sm p-8 rounded-3xl shadow-2xl">
            <h1 class="text-2xl font-bold text-center mb-6">Clips Papelaria</h1>
            <input type="tel" id="phoneInput" class="w-full border rounded-xl px-4 py-3 mb-4" placeholder="(00) 00000-0000">
            <button id="loginButton" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg">Entrar na Loja</button>
        </div>
    </div>

    <div id="mainApp" class="hidden pb-28">
        <header class="bg-white/95 sticky top-0 z-40 p-4 shadow-sm">
            <div class="max-w-7xl mx-auto flex flex-col gap-4">
                <div class="flex justify-between items-center">
                    <h1 class="font-bold text-xl text-blue-800">Clips Papelaria</h1>
                    <div class="bg-blue-100 p-2 rounded-full"><i class="fas fa-user text-blue-600"></i></div>
                </div>
                <div class="flex gap-2 overflow-x-auto pb-2">
                    <button class="filter-tab active px-4 py-2 rounded-full text-sm font-semibold" data-category="todos">Todos</button>
                    <button class="filter-tab px-4 py-2 rounded-full text-sm font-semibold" data-category="escolar">Escolar</button>
                    <button class="filter-tab px-4 py-2 rounded-full text-sm font-semibold" data-category="escritorio">Escritório</button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4">
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </main>
    </div>

    <div id="cartBar" class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t hidden z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500">Total do pedido</p>
                <p id="cartTotal" class="text-xl font-bold text-blue-700">R$ 0,00</p>
            </div>
            <button id="checkoutButton" class="bg-green-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg">Enviar Pedido</button>
        </div>
    </div>

    <script>
        let products = [];
        let cart = {};
        let currentCategory = 'todos';

        // CARREGAR DADOS DO JSON (BANCO DE DADOS DO N8N)
        async function loadProducts() {
            try {
                // Adicionamos um timestamp para evitar que o navegador use o cache antigo
                const response = await fetch('produtos.json?t=' + Date.now());
                products = await response.json();
                renderProducts();
            } catch (e) {
                console.error("Erro ao carregar produtos:", e);
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const filtered = products.filter(p => currentCategory === 'todos' || p.category === currentCategory);
            
            filtered.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product-card shadow-sm border p-3';
                div.innerHTML = `
                    <img src="${p.image}" class="product-image rounded-xl mb-3">
                    <h3 class="text-sm font-medium text-gray-800 line-clamp-2 mb-2">${p.name}</h3>
                    <div class="flex justify-between items-center">
                        <span class="text-blue-700 font-bold">${parseFloat(p.priceTo).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</span>
                        <button onclick="addToCart(${p.id})" class="add-button"><i class="fas fa-plus"></i></button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartUI();
        }

        function updateCartUI() {
            let total = 0;
            let count = 0;
            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                if(p) {
                    total += p.priceTo * qty;
                    count += qty;
                }
            });
            document.getElementById('cartTotal').innerText = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            document.getElementById('cartBar').classList.toggle('hidden', count === 0);
        }

        // Login e Inicialização
        document.getElementById('loginButton').onclick = () => {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadProducts();
        };

        document.querySelectorAll('.filter-tab').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                renderProducts();
            };
        });

        // Enviar para o WhatsApp
        document.getElementById('checkoutButton').onclick = () => {
            let msg = "*NOVO PEDIDO CLIPS*\n\n";
            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                msg += `• ${qty}x ${p.name}\n`;
            });
            window.open(`https://wa.me/5511999999999?text=${encodeURIComponent(msg)}`);
        };
    </script>
</body>
</html>
