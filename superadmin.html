<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Master - Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .sidebar-link { transition: all 0.2s; border-left: 3px solid transparent; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.05); border-left-color: #6366f1; color: white; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #clientModal, #toast { transition: opacity 0.3s ease, visibility 0.3s; opacity: 0; pointer-events: none; visibility: hidden; }
        #clientModal.visible, #toast.visible { opacity: 1; pointer-events: auto; visibility: visible; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <div id="masterLogin" class="fixed inset-0 z-[100] bg-[#020617] flex items-center justify-center p-6">
        <div class="w-full max-w-sm glass-panel p-8 rounded-2xl text-center shadow-2xl">
            <div class="w-16 h-16 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-6 text-2xl shadow-lg"><i class="fas fa-crown"></i></div>
            <h1 class="text-2xl font-bold mb-2">Acesso Master</h1>
            <input type="password" id="masterPass" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 mb-4 text-center text-white outline-none" placeholder="Senha Mestra">
            <button onclick="checkMasterAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg">Entrar</button>
        </div>
    </div>

    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><i class="fas fa-layer-group text-sm"></i></div>
            <span class="font-bold tracking-wide">SaaS Admin</span>
        </div>
        <nav class="flex-1 py-4 space-y-1">
            <a href="#" onclick="switchTab('clients')" id="nav-clients" class="sidebar-link active flex items-center gap-3 px-6 py-3 text-slate-400 text-sm font-medium">
                <i class="fas fa-users w-5"></i> Clientes (Lojistas)
            </a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col bg-[#020617] relative overflow-hidden">
        
        <div id="tab-clients" class="content-tab flex-1 overflow-y-auto p-6 md:p-10 fade-in">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <div>
                    <h2 class="text-2xl font-bold">Gerenciar Lojistas</h2>
                    <p class="text-slate-400 text-sm">Controle de acesso e assinaturas.</p>
                </div>
                <button onclick="openClientModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2">
                    <i class="fas fa-plus"></i> Novo Lojista
                </button>
            </div>

            <div class="glass-panel rounded-2xl overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-900/50 text-slate-400 text-xs uppercase font-bold">
                        <tr>
                            <th class="p-5">ID</th>
                            <th class="p-5">Loja</th>
                            <th class="p-5">E-mail (Login)</th>
                            <th class="p-5 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientsList" class="text-sm divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="clientModal" class="fixed inset-0 z-[80] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-700 shadow-2xl relative">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-bold">Cadastrar Novo Lojista</h3>
                <button onclick="closeClientModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Nome da Loja</label>
                    <input type="text" id="newStoreName" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none" placeholder="Ex: Papelaria Silva">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-1">E-mail de Acesso</label>
                    <input type="email" id="newStoreEmail" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none" placeholder="loja@email.com">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Telefone (Opcional)</label>
                    <input type="text" id="newStorePhone" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none" placeholder="5511999999999">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Telegram Chat ID (Para o Bot)</label>
                    <input type="text" id="newStoreChatId" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none" placeholder="Ex: 5876208013">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 uppercase block mb-1">Senha Inicial</label>
                    <div class="flex gap-2">
                        <input type="text" id="newStorePass" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none" value="123456">
                        <button onclick="generatePass()" class="bg-slate-700 px-4 rounded-xl hover:bg-slate-600"><i class="fas fa-random"></i></button>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-slate-700 flex justify-end gap-3">
                <button onclick="closeClientModal()" class="px-4 py-2 text-slate-400 hover:text-white">Cancelar</button>
                <button onclick="saveClient()" id="btnSaveClient" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl font-bold transition-all">Criar Acesso</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-white text-slate-900 px-6 py-4 rounded-xl shadow-2xl font-bold flex items-center gap-3 z-[90]">
        <i class="fas fa-check-circle text-green-500 text-xl"></i>
        <span id="toastMsg">Sucesso!</span>
    </div>

    <script>
        const MASTER_PASS = "admin123"; 
        const API_URL = "COLOQUE_AQUI_O_WEBHOOK_DO_SUPER_ADMIN"; // Precisa de um Webhook no n8n para isso

        function checkMasterAuth() {
            if(document.getElementById('masterPass').value === MASTER_PASS) {
                document.getElementById('masterLogin').classList.add('hidden');
                // fetchClients(); // Descomente quando plugar o n8n
            } else { alert("Senha incorreta!"); }
        }

        function switchTab(tabId) { /* Lógica de Abas */ }

        function openClientModal() { document.getElementById('clientModal').classList.add('visible'); }
        function closeClientModal() { document.getElementById('clientModal').classList.remove('visible'); }
        function generatePass() { document.getElementById('newStorePass').value = Math.random().toString(36).slice(-8); }

        async function saveClient() {
            const name = document.getElementById('newStoreName').value;
            const email = document.getElementById('newStoreEmail').value;
            const phone = document.getElementById('newStorePhone').value;
            const chat_id = document.getElementById('newStoreChatId').value;
            const pass = document.getElementById('newStorePass').value;
            const btn = document.getElementById('btnSaveClient');

            if(!name || !email || !pass) return alert("Nome, E-mail e Senha são obrigatórios");

            btn.innerText = "Salvando..."; btn.disabled = true;

            try {
                // Requisição pro n8n salvar o usuário no banco
                /*
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ 
                        action: 'create_user',
                        nome_loja: name, email: email, telefone: phone, chat_id: chat_id, senha: pass
                    })
                });
                */
                
                // Simulação de sucesso
                setTimeout(() => {
                    closeClientModal();
                    showToast("Lojista criado com sucesso!");
                    btn.innerText = "Criar Acesso"; btn.disabled = false;
                }, 1000);

            } catch (e) {
                alert("Erro ao salvar.");
                btn.innerText = "Criar Acesso"; btn.disabled = false;
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3000);
        }
    </script>
</body>
</html>
