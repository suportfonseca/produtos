<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Master - Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        .sidebar-link { transition: all 0.2s; border-left: 3px solid transparent; cursor: pointer; }
        .sidebar-link:hover, .sidebar-link.active { background: rgba(255,255,255,0.05); border-left-color: #6366f1; color: white; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        #clientModal, #toast { transition: opacity 0.3s ease, visibility 0.3s; opacity: 0; pointer-events: none; visibility: hidden; }
        #clientModal.visible, #toast.visible { opacity: 1; pointer-events: auto; visibility: visible; }
        .status-badge { padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-expired { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <div id="masterLogin" class="fixed inset-0 z-[100] bg-[#020617] flex items-center justify-center p-6">
        <div class="w-full max-w-sm glass-panel p-8 rounded-2xl text-center shadow-2xl">
            <div class="w-16 h-16 bg-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-6 text-2xl shadow-lg"><i class="fas fa-crown"></i></div>
            <h1 class="text-2xl font-bold mb-2">Acesso Master</h1>
            <input type="password" id="masterPass" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 mb-4 text-center text-white outline-none focus:border-indigo-500" placeholder="Senha Mestra">
            <button onclick="checkMasterAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg">Entrar</button>
        </div>
    </div>

    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col z-20">
        <div class="p-6 flex items-center gap-3 border-b border-slate-800/50">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white"><i class="fas fa-layer-group text-sm"></i></div>
            <span class="font-bold tracking-wide">SaaS Admin</span>
        </div>
        <nav class="flex-1 py-4 space-y-1">
            <div onclick="switchTab('clients')" id="nav-clients" class="sidebar-link active flex items-center gap-3 px-6 py-3 text-slate-400 text-sm font-medium">
                <i class="fas fa-users w-5"></i> Lojistas
            </div>
            <div onclick="switchTab('subs')" id="nav-subs" class="sidebar-link flex items-center gap-3 px-6 py-3 text-slate-400 text-sm font-medium">
                <i class="fas fa-credit-card w-5"></i> Assinaturas Ativas
            </div>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col bg-[#020617] relative overflow-hidden">
        
        <div id="tab-clients" class="content-tab flex-1 overflow-y-auto p-6 md:p-10 fade-in">
            <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                <div>
                    <h2 class="text-2xl font-bold">Gestão de Lojistas</h2>
                    <p class="text-slate-400 text-sm">Cadastre e gerencie o acesso de seus clientes.</p>
                </div>
                <button onclick="openClientModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition-all flex items-center gap-2">
                    <i class="fas fa-plus"></i> Novo Lojista
                </button>
            </div>

            <div class="glass-panel rounded-2xl overflow-hidden border border-white/5">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-900/50 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
                        <tr>
                            <th class="p-5">Lojista / Loja</th>
                            <th class="p-5">Acesso (E-mail)</th>
                            <th class="p-5">Status</th>
                            <th class="p-5 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="clientsList" class="text-sm divide-y divide-slate-800">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="tab-subs" class="content-tab hidden flex-1 overflow-y-auto p-6 md:p-10 fade-in">
            <h2 class="text-2xl font-bold mb-4">Relatório de Assinaturas</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="statsArea">
                </div>
        </div>
    </main>

    <div id="clientModal" class="fixed inset-0 z-[80] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="bg-slate-900 w-full max-w-lg rounded-2xl border border-slate-700 shadow-2xl relative">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h3 class="text-xl font-bold" id="modalTitle">Cadastrar Novo Lojista</h3>
                <button onclick="closeClientModal()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editUserId">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nome da Loja</label>
                    <input type="text" id="newStoreName" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500" placeholder="Ex: Boutique Fashion">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">E-mail de Login</label>
                    <input type="email" id="newStoreEmail" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500" placeholder="cliente@email.com">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Nova Senha</label>
                    <div class="flex gap-2">
                        <input type="text" id="newStorePass" class="w-full bg-[#020617] border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500" placeholder="Min. 6 caracteres">
                        <button onclick="generatePass()" class="bg-slate-700 px-4 rounded-xl hover:bg-slate-600"><i class="fas fa-random"></i></button>
                    </div>
                </div>
            </div>
            <div class="p-6 border-t border-slate-700 flex justify-end gap-3">
                <button onclick="closeClientModal()" class="px-4 py-2 text-slate-400 hover:text-white text-sm">Cancelar</button>
                <button onclick="saveClient()" id="btnSaveClient" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-xl font-bold transition-all text-sm uppercase">Salvar Lojista</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-indigo-600 text-white px-6 py-4 rounded-xl shadow-2xl font-bold flex items-center gap-3 z-[90]">
        <i class="fas fa-check-circle text-xl"></i>
        <span id="toastMsg">Sucesso!</span>
    </div>

    <script>
        const MASTER_PASS = "admin123"; 
        const API_URL = "https://n8n.seudominio.com/webhook/superadmin"; // ATENÇÃO: COLOQUE SEU WEBHOOK AQUI

        function checkMasterAuth() {
            if(document.getElementById('masterPass').value === MASTER_PASS) {
                document.getElementById('masterLogin').classList.add('hidden');
                fetchClients();
            } else { alert("Senha mestra inválida!"); }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.content-tab').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        function openClientModal(id = null) {
            document.getElementById('clientModal').classList.add('visible');
            if(!id) {
                document.getElementById('modalTitle').innerText = "Cadastrar Novo Lojista";
                document.getElementById('editUserId').value = "";
                document.getElementById('newStoreName').value = "";
                document.getElementById('newStoreEmail').value = "";
            }
        }

        function closeClientModal() { document.getElementById('clientModal').classList.remove('visible'); }
        function generatePass() { document.getElementById('newStorePass').value = Math.random().toString(36).slice(-8); }

        async function fetchClients() {
            try {
                const res = await fetch(API_URL + "?action=list_users");
                const data = await res.json();
                renderClients(data);
            } catch (e) { console.error("Erro ao listar:", e); }
        }

        function renderClients(clients) {
            const list = document.getElementById('clientsList');
            list.innerHTML = clients.map(c => `
                <tr class="hover:bg-white/5 transition-colors group">
                    <td class="p-5 font-bold text-slate-200">${c.nome_loja}</td>
                    <td class="p-5 text-slate-400">${c.email}</td>
                    <td class="p-5">
                        <span class="status-badge ${c.status_assinatura === 'ativo' ? 'status-active' : 'status-expired'}">
                            ${c.status_assinatura || 'Ativo'}
                        </span>
                    </td>
                    <td class="p-5 text-right flex justify-end gap-2">
                        <button onclick="impersonate('${c.id_usuario}', '${c.nome_loja}', '${c.email}')" class="w-9 h-9 glass-panel rounded-lg flex items-center justify-center text-indigo-400 hover:bg-indigo-600 hover:text-white transition-all" title="Acessar conta">
                            <i class="fas fa-sign-in-alt"></i>
                        </button>
                        <button onclick="openClientModal('${c.id_usuario}')" class="w-9 h-9 glass-panel rounded-lg flex items-center justify-center text-slate-400 hover:bg-white hover:text-black transition-all">
                            <i class="fas fa-edit"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // FUNÇÃO MASTER: "Login como Cliente"
        function impersonate(id, name, email) {
            const sessionData = { id: id, nome: name, email: email };
            localStorage.setItem('user_session', JSON.stringify(sessionData));
            showToast("Acessando conta de " + name + "...");
            setTimeout(() => {
                window.open('admin.html', '_blank'); // Abre o painel do lojista já logado
            }, 1000);
        }

        async function saveClient() {
            const btn = document.getElementById('btnSaveClient');
            const payload = {
                action: 'save_user',
                id: document.getElementById('editUserId').value,
                nome_loja: document.getElementById('newStoreName').value,
                email: document.getElementById('newStoreEmail').value,
                senha: document.getElementById('newStorePass').value
            };

            btn.innerText = "Processando...";
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showToast("Dados salvos com sucesso!");
                closeClientModal();
                fetchClients();
            } catch (e) { alert("Erro ao salvar."); }
            finally { btn.innerText = "Salvar Lojista"; }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3000);
        }
    </script>
</body>
</html>
