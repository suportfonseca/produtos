<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Oficial - Clips Papelaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { brand: { 500: '#2563eb', 600: '#1d4ed8', 900: '#1e3a8a' }, dark: { 950: '#020617', 900: '#0f172a' } }, 
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                    boxShadow: { 'soft': '0 10px 40px -10px rgba(0,0,0,0.08)', 'heavy': '0 20px 50px -10px rgba(0,0,0,0.3)' }
                } 
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .card-media { transition: opacity 0.7s ease-in-out; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-brand-600 text-white text-center">
        <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 mix-blend-soft-light"></div>
        <div class="w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl relative fade-in border border-white/20">
            <div class="w-20 h-20 bg-brand-50 rounded-3xl flex items-center justify-center mx-auto mb-6 text-brand-600 text-4xl animate-bounce"><i class="fas fa-gift"></i></div>
            <h1 class="text-3xl font-display font-black text-slate-900 mb-3 leading-tight">Olá! 👋</h1>
            <p class="text-slate-500 font-medium mb-8">Digite seu WhatsApp para carregar seus itens e acessar o catálogo.</p>
            <input type="tel" id="phoneInput" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 px-4 font-bold text-slate-800 mb-4 outline-none focus:border-brand-500 text-center shadow-inner" placeholder="DDD + Seu Número">
            <button id="loginButton" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-5 rounded-2xl shadow-xl uppercase text-sm tracking-widest transition-all">Acessar Catálogo</button>
        </div>
    </div>

    <div id="mainApp" class="hidden flex-1 pb-32">
        <header class="glass sticky top-0 z-40 p-4">
            <div class="max-w-6xl mx-auto flex justify-between items-center mb-4">
                <div class="flex items-center gap-3 text-brand-600"><i class="fas fa-paperclip text-xl"></i><span class="font-black uppercase tracking-tighter text-lg text-center">Catálogo Digital</span></div>
                <button onclick="logout()" class="text-[10px] font-bold text-slate-400 hover:text-red-500 transition-colors uppercase"><i class="fas fa-sign-out-alt mr-1"></i> Sair</button>
            </div>
            <div class="max-w-6xl mx-auto">
                <div class="bg-gradient-to-br from-brand-600 to-brand-900 rounded-[2rem] p-8 text-white shadow-heavy relative overflow-hidden text-center uppercase">
                    <p class="text-xs font-bold text-blue-200 mb-2 uppercase tracking-[0.2em]"><i class="fas fa-bolt mr-1 text-yellow-300"></i> Cliente: <span id="displayUserPhone">...</span></p>
                    <h2 id="campaignTitleDisplay" class="text-2xl md:text-3xl font-display font-black tracking-tight leading-tight uppercase">Carregando...</h2>
                </div>
            </div>
        </header>
        <main class="max-w-6xl mx-auto p-4 pt-8 text-center"><div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div></main>
    </div>

    <div id="cartModal" class="fixed inset-0 z-[70] hidden">
        <div class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm" onclick="closeCartModal()"></div>
        <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[3rem] slide-up max-h-[90vh] flex flex-col shadow-heavy">
            <div class="p-8 border-b border-slate-100 flex justify-between items-center bg-white rounded-t-[3rem]">
                <div><h2 class="text-2xl font-display font-black text-slate-900">Seu Pedido</h2><p class="text-xs text-slate-400 font-bold" id="cartSummaryText">0 itens</p></div>
                <div class="flex gap-2">
                    <button onclick="clearCart()" class="text-[10px] font-bold text-red-500 bg-red-50 px-3 py-2 rounded-xl uppercase">Limpar</button>
                    <button onclick="closeCartModal()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div id="cartItemsList" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50 no-scrollbar"></div>
            <div class="p-8 bg-white border-t border-slate-100">
                <div class="flex justify-between text-slate-900 text-2xl font-black mb-6"><span>Total</span><span id="summaryTotal">R$ 0,00</span></div>
                
                <div class="mb-4">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-2 block">Quem está te atendendo?</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-brand-500"></i>
                        <select id="vendedorSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-4 pl-10 pr-4 font-bold text-slate-800 outline-none focus:border-brand-500 appearance-none cursor-pointer">
                            <option value="loja">Ninguém / Loja Oficial</option>
                            </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                    </div>
                </div>

                <button onclick="finalizeOrder()" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-5 rounded-2xl shadow-xl active:scale-95 flex items-center justify-center gap-3 text-lg transition-transform">
                    <span>Finalizar Pedido</span> <i class="fab fa-whatsapp text-2xl"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="productModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/95 backdrop-blur-sm" onclick="closeProductModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none p-4">
            <div class="bg-white w-full max-w-lg rounded-[3rem] shadow-2xl pointer-events-auto overflow-hidden flex flex-col slide-up max-h-[90vh]">
                <div class="relative h-72 bg-black shrink-0">
                    <div id="modalMediaContainer" class="w-full h-full"></div>
                    <button onclick="closeProductModal()" class="absolute top-6 right-6 w-12 h-12 bg-white/20 backdrop-blur rounded-full text-white z-20 hover:bg-red-500 transition-colors"><i class="fas fa-times"></i></button>
                    <div id="modalNav" class="hidden"><button onclick="navModal(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/40 text-white z-20 rounded-full"><i class="fas fa-chevron-left"></i></button><button onclick="navModal(1)" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/40 text-white z-20 rounded-full"><i class="fas fa-chevron-right"></i></button></div>
                </div>
                <div class="p-8 overflow-y-auto bg-white flex-1 text-center no-scrollbar">
                    <h2 id="modalTitle" class="text-2xl font-black text-slate-900 mb-6 uppercase">Nome</h2>
                    <div class="flex items-center justify-center gap-4 mb-8 bg-slate-50 p-6 rounded-3xl border border-slate-100">
                        <p id="modalPrice" class="text-4xl font-black text-brand-600">R$ 0,00</p>
                        <p id="modalOldPrice" class="text-lg text-slate-400 line-through hidden font-medium">R$ 0,00</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-xs mb-10">
                        <div class="bg-slate-50 p-4 rounded-2xl shadow-inner"><p class="text-slate-400 font-bold uppercase mb-2">Cor</p><p id="modalColor" class="font-black text-slate-800 text-sm">-</p></div>
                        <div class="bg-slate-50 p-4 rounded-2xl shadow-inner"><p class="text-slate-400 font-bold uppercase mb-2">Tamanho</p><p id="modalSize" class="font-black text-slate-800 text-sm">-</p></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center bg-slate-100 rounded-2xl px-2 h-16 border border-slate-200 shadow-inner">
                            <button onclick="updateTempQty(-1)" class="w-12 text-slate-600 text-xl font-bold">-</button>
                            <span id="tempQtyDisplay" class="font-black text-xl w-10 text-center">1</span>
                            <button onclick="updateTempQty(1)" class="w-12 text-slate-600 text-xl font-bold">+</button>
                        </div>
                        <button onclick="addToCartFromModal()" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-black py-5 rounded-2xl shadow-xl uppercase text-sm tracking-tighter">Adicionar ao Pedido</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="cartBar" class="fixed bottom-8 left-4 right-4 z-50 hidden md:max-w-md md:mx-auto">
        <div class="bg-slate-900 rounded-[2.2rem] p-5 shadow-heavy flex justify-between items-center border border-white/10 cursor-pointer" onclick="openCartModal()">
            <div class="pl-4">
                <p class="text-[9px] text-brand-400 uppercase font-black tracking-[0.2em] mb-1">Total do Pedido</p>
                <p id="cartBarTotal" class="text-2xl font-display font-black text-white leading-none">R$ 0,00</p>
            </div>
            <button class="bg-brand-500 text-white px-8 py-4 rounded-[1.5rem] font-black text-xs uppercase shadow-lg flex items-center gap-2">CARRINHO <i class="fas fa-shopping-cart"></i></button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const CONFIG = { whatsappNumber: "5551999301100", apiUrl: "https://n8n.srv1327557.hstgr.cloud/webhook/d7fa7895-7f17-45bb-95a4-92e18f1c1692", campaignId: urlParams.get('id') };
        
        let products = [], cart = {}, tempQty = 1, currentProduct = null, currentMediaIdx = 0, userPhone = "";
        let teamList = [];

        // ====== MAGICA DO LINK DE AFILIADO ======
        const vCode = urlParams.get('v');
        if (vCode) {
            localStorage.setItem('saved_vendedor_code', vCode);
        }
        // ========================================

        function isVideo(url) { if (!url) return false; return url.includes('.mp4') || url.includes('.mov') || url.includes('.webm'); }
        
        function buildMediaTag(url, classes, isCard = true, isStatic = false) {
            if (isVideo(url)) {
                const videoAttrs = isStatic 
                    ? `preload="metadata" muted playsinline` 
                    : `autoplay loop muted playsinline ${isCard ? 'disableRemotePlayback' : 'controls'}`;
                return `<video src="${url}" class="${classes}" ${videoAttrs}></video>`;
            }
            return `<img src="${url}" class="${classes}" onerror="this.src='https://placehold.co/400?text=Erro+Imagem'">`;
        }

        async function loadProducts() {
            try {
                // Passo 1: Busca os Produtos
                const res = await fetch(`${CONFIG.apiUrl}?id_campanha=${CONFIG.campaignId}`);
                const data = await res.json();
                let rawList = Array.isArray(data) ? data : (data.products || []);
                if (rawList.length > 0) {
                    const first = rawList[0].json || rawList[0];
                    if (first.nome_campanha) document.getElementById('campaignTitleDisplay').innerText = first.nome_campanha.toUpperCase();
                }
                products = rawList.map((item, i) => {
                    const p = item.json || item;
                    let midias = p.midias_detalhadas ? p.midias_detalhadas.filter(m => m.ativo).map(m => m.url) : (p.imagens || []);
                    if(midias.length === 0 && p.url_publica) midias.push(p.url_publica);
                    return { id: p.id_grupo || p.id || i, name: p.nome_produto, desc: p.descricao, priceFrom: p.preco_de, priceTo: p.preco_por || "0.00", cor: p.cor || "-", tamanho: p.tamanho || "-", images: midias, active: p.ativo !== false };
                }).filter(p => p.active);
                renderProducts();

                // Passo 2: Busca os Vendedores (Com blindagem inteligente)
                const resVendedores = await fetch(`${CONFIG.apiUrl}?acao=vendedores&id_campanha=${CONFIG.campaignId}`);
                const dataVendedores = await resVendedores.json();
                
                // Inteligência para ler independente de como o n8n enviar
                if (Array.isArray(dataVendedores)) {
                    teamList = dataVendedores;
                } else if (dataVendedores && dataVendedores.nome) {
                    teamList = [dataVendedores]; // Se vier só um vendedor solto, transforma em lista
                } else {
                    teamList = [];
                }
                
                renderVendedorDropdown();

            } catch (e) { console.error("Erro ao carregar dados:", e); }
        }

        function renderVendedorDropdown() {
            const select = document.getElementById('vendedorSelect');
            const savedCode = localStorage.getItem('saved_vendedor_code');

            teamList.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.telefone; 
                opt.text = v.nome;
                
                if (savedCode && savedCode.toLowerCase() === v.codigo_afiliado.toLowerCase()) {
                    opt.selected = true;
                }
                
                select.appendChild(opt);
            });
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
            products.forEach(p => {
                let mediaHTML = p.images.length > 0 ? buildMediaTag(p.images[0], `card-media absolute inset-0 w-full h-full object-cover opacity-100 z-10`) : `<img src="https://placehold.co/400?text=Sem+Foto" class="card-media absolute inset-0 w-full h-full object-cover opacity-100 z-10">`;
                const pDe = parseFloat(p.priceFrom), pPor = parseFloat(p.priceTo);
                const descP = pDe && pDe > pPor ? Math.round(((pDe - pPor) / pDe) * 100) : 0;
                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-[2rem] p-4 shadow-soft border border-slate-100 flex flex-col h-full cursor-pointer relative overflow-hidden group';
                card.onclick = () => openProductModal(p);
                card.innerHTML = `<div class="relative w-full aspect-square rounded-[1.8rem] overflow-hidden mb-4 bg-slate-50">${mediaHTML}${descP > 0 ? `<div class="absolute top-4 left-4 bg-red-500 text-white text-[9px] font-black px-3 py-1.5 rounded-xl z-20 shadow-lg">-${descP}% OFF</div>` : ''}<button onclick="event.stopPropagation(); fastAdd('${p.id}')" class="absolute bottom-4 right-4 bg-brand-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-heavy z-30 transform hover:scale-110 active:scale-95 transition-all"><i class="fas fa-plus"></i></button></div><div class="flex-1 flex flex-col text-center"><p class="text-[8px] text-slate-400 font-bold uppercase tracking-widest mb-1">${p.cor} | ${p.tamanho}</p><h3 class="text-sm font-bold text-slate-800 line-clamp-2 mb-3 leading-snug">${p.name}</h3><div class="mt-auto">${pDe > pPor ? `<span class="text-[10px] text-slate-400 line-through font-medium">R$ ${pDe.toFixed(2)}</span>` : ''}<span class="text-xl font-black text-brand-600 block leading-none">R$ ${pPor.toFixed(2)}</span></div></div>`;
                grid.appendChild(card);
            });
        }

        function saveCart() { localStorage.setItem(`cart_${userPhone}_${CONFIG.campaignId}`, JSON.stringify(cart)); }
        function fastAdd(id) { cart[id] = (cart[id] || 0) + 1; saveCart(); updateUI(); }
        function addToCartFromModal() { cart[currentProduct.id] = (cart[currentProduct.id] || 0) + tempQty; saveCart(); closeProductModal(); updateUI(); }
        
        function updateUI() {
            const count = Object.values(cart).reduce((a,b)=>a+b, 0);
            const total = Object.entries(cart).reduce((acc, [id, qty]) => {
                const p = products.find(x => x.id == id);
                return acc + (p ? parseFloat(p.priceTo) * qty : 0);
            }, 0);
            const cb = document.getElementById('cartBar');
            if(count > 0) {
                cb.classList.remove('hidden');
                document.getElementById('cartBarTotal').innerText = `R$ ${total.toFixed(2)}`;
                if(!document.getElementById('cartModal').classList.contains('hidden')) {
                   document.getElementById('summaryTotal').innerText = `R$ ${total.toFixed(2)}`;
                   document.getElementById('cartSummaryText').innerText = `${count} itens`;
                }
            } else cb.classList.add('hidden');
        }

        function openCartModal() {
            const list = document.getElementById('cartItemsList'); list.innerHTML = '';
            let total = 0;
            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                if(p) {
                    const sub = parseFloat(p.priceTo) * qty; total += sub;
                    const imgTag = buildMediaTag(p.images[0], "w-14 h-14 rounded-xl object-cover bg-slate-100", true, true);
                    list.innerHTML += `<div class="flex gap-4 bg-white p-4 rounded-[1.5rem] shadow-sm items-center">${imgTag}<div class="flex-1 leading-tight"><h4 class="text-sm font-black">${p.name}</h4><p class="text-[10px] text-slate-400 mt-1 uppercase font-bold">${p.cor} | ${p.tamanho}</p></div><div class="flex items-center bg-slate-100 rounded-lg h-8 px-2"><button onclick="changeQty('${p.id}', -1)" class="px-2 font-bold">-</button><span class="w-4 text-center text-xs font-black">${qty}</span><button onclick="changeQty('${p.id}', 1)" class="px-2 font-bold">+</button></div></div>`;
                }
            });
            document.getElementById('summaryTotal').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('cartSummaryText').innerText = `${Object.values(cart).reduce((a,b)=>a+b, 0)} itens`;
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function changeQty(id, val) { cart[id] += val; if(cart[id] <= 0) delete cart[id]; saveCart(); openCartModal(); updateUI(); }
        function clearCart() { if(confirm("Limpar carrinho?")) { cart = {}; saveCart(); closeCartModal(); updateUI(); } }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

        document.getElementById('loginButton').onclick = () => {
            userPhone = document.getElementById('phoneInput').value.replace(/\D/g,'');
            if(userPhone.length < 8) return;
            sessionStorage.setItem('logged_phone', userPhone);
            initApp();
        };
        function initApp() {
            userPhone = sessionStorage.getItem('logged_phone');
            document.getElementById('displayUserPhone').innerText = userPhone;
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadProducts().then(() => {
                const saved = localStorage.getItem(`cart_${userPhone}_${CONFIG.campaignId}`);
                if(saved) cart = JSON.parse(saved);
                updateUI();
            });
        }
        if(sessionStorage.getItem('logged_phone')) initApp();
        function logout() { sessionStorage.removeItem('logged_phone'); location.reload(); }

        function openProductModal(p) {
            currentProduct = p; currentMediaIdx = 0; tempQty = 1;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalPrice').innerText = `R$ ${parseFloat(p.priceTo).toFixed(2)}`;
            document.getElementById('modalColor').innerText = p.cor;
            document.getElementById('modalSize').innerText = p.tamanho;
            const op = document.getElementById('modalOldPrice');
            if (p.priceFrom && parseFloat(p.priceFrom) > parseFloat(p.priceTo)) { op.innerText = `R$ ${parseFloat(p.priceFrom).toFixed(2)}`; op.classList.remove('hidden'); } else { op.classList.add('hidden'); }
            document.getElementById('tempQtyDisplay').innerText = "1";
            renderModalMedia(); document.getElementById('productModal').classList.remove('hidden');
        }
        function renderModalMedia() {
            const container = document.getElementById('modalMediaContainer');
            const url = currentProduct.images[currentMediaIdx] || 'https://placehold.co/400?text=Sem+Foto';
            container.innerHTML = buildMediaTag(url, "w-full h-full object-contain bg-black", false);
            document.getElementById('modalNav').classList.toggle('hidden', currentProduct.images.length <= 1);
        }
        function navModal(dir) { currentMediaIdx = (currentMediaIdx + dir + currentProduct.images.length) % currentProduct.images.length; renderModalMedia(); }
        function closeProductModal() { document.getElementById('productModal').classList.add('hidden'); }
        function updateTempQty(val) { tempQty = Math.max(1, tempQty + val); document.getElementById('tempQtyDisplay').innerText = tempQty; }

        function finalizeOrder() {
            const selectTarget = document.getElementById('vendedorSelect');
            const selectedPhone = selectTarget.value;
            
            let whatsappTarget = selectedPhone === 'loja' ? CONFIG.whatsappNumber : selectedPhone;

            let msg = `🛒 *PEDIDO - CLIPS PAPELARIA*\n*Cliente:* ${userPhone}\n`;
            
            if(selectedPhone !== 'loja') {
                const vendedorNome = selectTarget.options[selectTarget.selectedIndex].text;
                msg += `*Atendimento:* ${vendedorNome}\n`;
            }
            msg += `\n`;

            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                if (p) msg += `▫️ *${qty}x ${p.name}* (${p.cor}|${p.tamanho}) - R$ ${(parseFloat(p.priceTo)*qty).toFixed(2)}\n`;
            });
            msg += `\n💰 *TOTAL: ${document.getElementById('summaryTotal').innerText}*`;
            
            window.open(`https://wa.me/${whatsappTarget}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
