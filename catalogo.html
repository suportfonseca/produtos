<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clips Papelaria - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { brand: { 500: '#2563eb', 600: '#1d4ed8', 900: '#1e3a8a' }, dark: { 900: '#0f172a', 800: '#1e293b' } }, 
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] },
                    boxShadow: { 'soft': '0 10px 40px -10px rgba(0,0,0,0.08)' }
                } 
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .card-media { transition: opacity 0.7s ease-in-out; }
        #social-toast { transform: translateY(150%); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #social-toast.show { transform: translateY(0); }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 bg-brand-600 text-white">
        <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 mix-blend-soft-light"></div>
        <div class="w-full max-w-sm bg-white p-10 rounded-[3rem] shadow-2xl relative text-center fade-in border border-white/20">
            <div class="w-20 h-20 bg-brand-50 rounded-3xl flex items-center justify-center mx-auto mb-6 text-brand-600 text-4xl animate-bounce"><i class="fas fa-gift"></i></div>
            <h1 class="text-3xl font-display font-black text-slate-900 mb-3">Olá! 👋</h1>
            <p class="text-slate-500 font-medium mb-8">Você recebeu um catálogo exclusivo! Prepare seu pedido pelo WhatsApp.</p>
            <input type="tel" id="phoneInput" class="w-full bg-slate-50 border border-slate-200 rounded-2xl py-4 px-4 font-bold text-slate-800 mb-4 outline-none focus:border-brand-500 text-center" placeholder="Seu WhatsApp">
            <button id="loginButton" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-black py-5 rounded-2xl shadow-xl uppercase text-sm tracking-widest transition-all active:scale-95">Acessar Catálogo</button>
        </div>
    </div>

    <div id="mainApp" class="hidden flex-1 pb-32">
        <header class="glass sticky top-0 z-40 p-4">
            <div class="max-w-6xl mx-auto flex justify-between items-center mb-4">
                <div class="flex items-center gap-3 text-brand-600"><i class="fas fa-paperclip text-xl"></i><span class="font-black uppercase tracking-tighter text-lg">Catálogo Digital</span></div>
                <div onclick="finalizeOrder()" class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 relative cursor-pointer"><i class="fas fa-shopping-bag"></i><span id="headerCartBadge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-[10px] font-black rounded-full border-2 border-white hidden flex items-center justify-center">0</span></div>
            </div>
            <div class="max-w-6xl mx-auto">
                <div class="bg-gradient-to-br from-brand-600 to-brand-900 rounded-[2rem] p-8 text-white shadow-2xl relative overflow-hidden text-center">
                    <p class="text-xs font-bold text-blue-200 mb-2 uppercase tracking-[0.2em]">Campanha Ativa</p>
                    <h2 id="campaignTitleDisplay" class="text-3xl font-display font-black tracking-tight drop-shadow-lg uppercase">Carregando...</h2>
                </div>
            </div>
        </header>
        <main class="max-w-6xl mx-auto p-4"><div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div></main>
    </div>

    <div id="productModal" class="fixed inset-0 z-[60] hidden">
        <div class="absolute inset-0 bg-slate-900/95 backdrop-blur-sm" onclick="closeProductModal()"></div>
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none p-4">
            <div class="bg-white w-full max-w-lg rounded-[3rem] shadow-2xl pointer-events-auto overflow-hidden flex flex-col slide-up max-h-[90vh]">
                <div class="relative h-80 bg-black shrink-0">
                    <div id="modalMediaContainer" class="w-full h-full"></div>
                    <button onclick="expandMedia()" class="absolute bottom-6 right-6 w-12 h-12 bg-white/20 backdrop-blur rounded-full text-white z-20 hover:bg-brand-600"><i class="fas fa-expand"></i></button>
                    <button onclick="closeProductModal()" class="absolute top-6 right-6 w-12 h-12 bg-white/20 backdrop-blur rounded-full text-white z-20 hover:bg-red-500"><i class="fas fa-times"></i></button>
                    <div id="modalNav" class="hidden"><button onclick="navModal(-1)" class="absolute left-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/40 text-white z-20 rounded-full"><i class="fas fa-chevron-left"></i></button><button onclick="navModal(1)" class="absolute right-4 top-1/2 -translate-y-1/2 w-10 h-10 bg-black/40 text-white z-20 rounded-full"><i class="fas fa-chevron-right"></i></button></div>
                </div>
                <div class="p-8 overflow-y-auto bg-white flex-1">
                    <h2 id="modalTitle" class="text-2xl font-black text-slate-900 mb-6">Nome</h2>
                    <div class="flex items-center gap-4 mb-8 bg-slate-50 p-6 rounded-3xl border border-slate-100">
                        <p id="modalPrice" class="text-4xl font-black text-brand-600">R$ 0,00</p>
                        <p id="modalOldPrice" class="text-lg text-slate-400 line-through hidden font-medium">R$ 0,00</p>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-xs mb-10">
                        <div class="bg-slate-50 p-4 rounded-2xl shadow-inner"><p class="text-slate-400 font-bold uppercase mb-2">Cor</p><p id="modalColor" class="font-black text-slate-800 text-sm">-</p></div>
                        <div class="bg-slate-50 p-4 rounded-2xl shadow-inner"><p class="text-slate-400 font-bold uppercase mb-2">Tamanho</p><p id="modalSize" class="font-black text-slate-800 text-sm">-</p></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center bg-slate-100 rounded-2xl px-2 h-16 border border-slate-200">
                            <button onclick="updateTempQty(-1)" class="w-12 text-slate-600 text-xl"><i class="fas fa-minus"></i></button>
                            <span id="tempQtyDisplay" class="font-black text-xl w-10 text-center">1</span>
                            <button onclick="updateTempQty(1)" class="w-12 text-slate-600 text-xl"><i class="fas fa-plus"></i></button>
                        </div>
                        <button id="modalAddBtn" class="flex-1 bg-brand-600 hover:bg-brand-700 text-white font-black py-5 rounded-2xl uppercase text-sm tracking-widest shadow-xl">Adicionar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="fullscreenOverlay" class="fixed inset-0 z-[150] hidden bg-black flex items-center justify-center p-4"><button onclick="closeFullscreen()" class="absolute top-6 right-6 text-white text-3xl"><i class="fas fa-times"></i></button><div id="fullscreenContent" class="w-full h-full flex items-center justify-center"></div></div>

    <div id="cartBar" class="fixed bottom-8 left-4 right-4 z-50 hidden md:max-w-md md:mx-auto">
        <div class="bg-slate-900 rounded-[2rem] p-6 shadow-2xl flex justify-between items-center border border-white/10" onclick="finalizeOrder()">
            <div class="pl-2"><p class="text-[10px] text-brand-400 uppercase font-black tracking-widest mb-1">Subtotal</p><p id="cartBarTotal" class="text-2xl font-display font-black text-white">R$ 0,00</p></div>
            <button class="bg-brand-500 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase">Finalizar <i class="fas fa-whatsapp ml-2"></i></button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const CONFIG = { whatsappNumber: "5551999301100", apiUrl: "https://n8n.srv1327557.hstgr.cloud/webhook/d7fa7895-7f17-45bb-95a4-92e18f1c1692", campaignId: urlParams.get('id') };
        if (!CONFIG.campaignId) { document.getElementById('errorScreen').classList.remove('hidden'); throw new Error(); }

        let products = [], cart = {}, tempQty = 1, currentProduct = null, currentMediaIdx = 0;

        function isVideo(url) { if (!url) return false; return url.includes('.mp4') || url.includes('.mov') || url.includes('.webm'); }
        function buildMedia(url, classes, isCard = true) {
            if (isVideo(url)) return `<video src="${url}" class="${classes}" autoplay loop muted playsinline ${isCard ? 'disableRemotePlayback' : 'controls'}></video>`;
            return `<img src="${url}" class="${classes}">`;
        }

        async function loadProducts() {
            try {
                const res = await fetch(`${CONFIG.apiUrl}?id_campanha=${CONFIG.campaignId}`);
                const data = await res.json();
                let rawList = Array.isArray(data) ? data : (data.products || []);
                
                if (rawList.length > 0) {
                    const first = rawList[0].json || rawList[0];
                    if (first.nome_campanha) document.getElementById('campaignTitleDisplay').innerText = first.nome_campanha;
                }

                products = rawList.map((item, i) => {
                    const p = item.json || item;
                    let midias = p.midias_detalhadas ? p.midias_detalhadas.filter(m => m.ativo).map(m => m.url) : (p.imagens || []);
                    return { id: p.id_grupo || p.id || i, name: p.nome_produto, desc: p.descricao, priceFrom: p.preco_de, priceTo: p.preco_por || "0.00", cor: p.cor || "-", tamanho: p.tamanho || "-", images: midias, active: p.ativo !== false };
                }).filter(p => p.active);

                renderProducts();
                setInterval(autoSlide, 4000);
            } catch (e) { console.error(e); }
        }

        function autoSlide() {
            document.querySelectorAll('.product-card').forEach(card => {
                const medias = card.querySelectorAll('.card-media');
                if (medias.length <= 1) return;
                let active = Array.from(medias).findIndex(m => m.classList.contains('opacity-100'));
                medias[active].classList.replace('opacity-100', 'opacity-0'); medias[active].classList.remove('z-10');
                let next = (active + 1) % medias.length;
                medias[next].classList.replace('opacity-0', 'opacity-100'); medias[next].classList.add('z-10');
            });
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid'); grid.innerHTML = '';
            products.forEach(p => {
                let mediaHTML = p.images.map((url, i) => buildMedia(url, `card-media absolute inset-0 w-full h-full object-cover transition-opacity duration-700 ${i === 0 ? 'opacity-100 z-10' : 'opacity-0 z-0'}`)).join('');
                const pDe = parseFloat(p.priceFrom), pPor = parseFloat(p.priceTo);
                const descP = pDe && pDe > pPor ? Math.round(((pDe - pPor) / pDe) * 100) : 0;
                const card = document.createElement('div');
                card.className = 'product-card bg-white rounded-[2.5rem] p-4 shadow-soft border border-slate-100 flex flex-col h-full cursor-pointer relative overflow-hidden group';
                card.onclick = () => openProductModal(p);
                card.innerHTML = `<div class="relative w-full aspect-square rounded-[2rem] overflow-hidden mb-4 bg-slate-50">${mediaHTML}${descP > 0 ? `<div class="absolute top-4 left-4 bg-red-500 text-white text-[10px] font-black px-3 py-1.5 rounded-xl z-20 shadow-lg">-${descP}% OFF</div>` : ''}</div><div class="flex-1 flex flex-col text-center"><h3 class="text-sm font-bold text-slate-800 line-clamp-2 mb-3 leading-snug">${p.name}</h3><div class="mt-auto">${pDe > pPor ? `<span class="text-[10px] text-slate-400 line-through">R$ ${pDe.toFixed(2)}</span>` : ''}<span class="text-xl font-black text-brand-600 block">R$ ${pPor.toFixed(2)}</span></div></div>`;
                grid.appendChild(card);
            });
        }

        function openProductModal(p) {
            currentProduct = p; currentMediaIdx = 0; tempQty = 1;
            document.getElementById('modalTitle').innerText = p.name;
            document.getElementById('modalPrice').innerText = `R$ ${parseFloat(p.priceTo).toFixed(2)}`;
            document.getElementById('modalColor').innerText = p.cor;
            document.getElementById('modalSize').innerText = p.tamanho;
            const oldPriceEl = document.getElementById('modalOldPrice');
            if (p.priceFrom && parseFloat(p.priceFrom) > parseFloat(p.priceTo)) { oldPriceEl.innerText = `R$ ${parseFloat(p.priceFrom).toFixed(2)}`; oldPriceEl.classList.remove('hidden'); } else { oldPriceEl.classList.add('hidden'); }
            renderModalMedia(); document.getElementById('productModal').classList.remove('hidden');
        }

        function renderModalMedia() {
            const container = document.getElementById('modalMediaContainer');
            container.innerHTML = buildMedia(currentProduct.images[currentMediaIdx], "w-full h-full object-contain", false);
            document.getElementById('modalNav').classList.toggle('hidden', currentProduct.images.length <= 1);
        }

        function navModal(dir) { currentMediaIdx = (currentMediaIdx + dir + currentProduct.images.length) % currentProduct.images.length; renderModalMedia(); }
        function expandMedia() { document.getElementById('fullscreenContent').innerHTML = buildMedia(currentProduct.images[currentMediaIdx], "max-w-full max-h-full", false); document.getElementById('fullscreenOverlay').classList.remove('hidden'); }
        function closeFullscreen() { document.getElementById('fullscreenOverlay').classList.add('hidden'); }
        function closeProductModal() { document.getElementById('productModal').classList.add('hidden'); }
        function updateTempQty(val) { tempQty = Math.max(1, tempQty + val); document.getElementById('tempQtyDisplay').innerText = tempQty; }
        
        document.getElementById('loginButton').onclick = () => {
            if(document.getElementById('phoneInput').value.length < 8) return;
            document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); loadProducts();
        };

        document.getElementById('modalAddBtn').onclick = () => { cart[currentProduct.id] = (cart[currentProduct.id] || 0) + tempQty; closeProductModal(); updateUI(); };
        function updateUI() {
            const count = Object.values(cart).reduce((a,b)=>a+b, 0);
            document.getElementById('headerCartBadge').innerText = count; document.getElementById('headerCartBadge').classList.toggle('hidden', count === 0);
            document.getElementById('cartBar').classList.toggle('hidden', count === 0);
            let total = 0; Object.entries(cart).forEach(([id, qty]) => { const p = products.find(x => x.id == id); if (p) total += parseFloat(p.priceTo) * qty; });
            document.getElementById('cartBarTotal').innerText = `R$ ${total.toFixed(2)}`;
        }
        function finalizeOrder() {
            let msg = `🛒 *PEDIDO - ${document.getElementById('campaignTitleDisplay').innerText}*\n\n`;
            let total = 0;
            Object.entries(cart).forEach(([id, qty]) => {
                const p = products.find(x => x.id == id);
                if (p) { const itemTotal = parseFloat(p.priceTo) * qty; total += itemTotal; msg += `▫️ *${qty}x ${p.name}*\n   C/T: ${p.cor} | ${p.tamanho}\n\n`; }
            });
            msg += `💰 *TOTAL: R$ ${total.toFixed(2)}*`;
            window.open(`https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
